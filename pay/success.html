<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23141C2B%27/%3E%3Crect x=%278%27 y=%277%27 width=%2716%27 height=%2718%27 rx=%272%27 fill=%27%23F2B84B%27/%3E%3C/svg%3E">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><meta name="robots" content="noindex">
<title>결제 완료</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&family=Do+Hyeon&display=swap">
<link rel="stylesheet" href="/pay/pay.css">
</head>
<body>
<header><div class="wrap"><a class="logo" href="/">하루<span>한권</span></a><a href="/store">스토어</a></div></header>
<main><div class="wrap" id="out">
  <h1>결제를 확인하고 있어요</h1><p class="sub">잠시만 기다려 주세요. 이 창을 닫지 마세요.</p>
</div></main>
<footer><div class="wrap">하루한권 · 사업자등록번호 693-63-00898 · <a href="/terms">이용약관</a> · <a href="/privacy">개인정보처리방침</a> · <a href="/terms#refund">환불정책</a></div></footer>
<script src="/books.js"></script>
<script src="/pay/pay.js"></script>
<script>
(async()=>{
  const q=new URLSearchParams(location.search), out=$("#out");
  const body={paymentKey:q.get("paymentKey"),orderId:q.get("orderId"),amount:Number(q.get("amount")),items:q.get("items")||"",bump:q.get("bump")||""};
  let o;
  try{
    const t=q.get("t")||(ORDERS.all().find(x=>x.orderId===body.orderId)||{}).ticket;
    const r=body.paymentKey?await fetch("/api/pay/confirm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
      :await fetch("/api/pay/order?"+(t?"t="+encodeURIComponent(t):"order="+encodeURIComponent(body.orderId||"")),{cache:"no-store"});
    o=await r.json(); if(!r.ok)throw new Error(o.message||"결제 승인에 실패했어요.");
  }catch(e){
    out.innerHTML=`<h1>결제를 마치지 못했어요</h1><p class="sub err">${esc(e.message)}</p><p class="note">카드 승인 문자가 왔다면 주문번호 <b>${esc(body.orderId||"")}</b>와 함께 고객센터로 알려 주세요. 승인이 안 된 결제는 자동으로 취소됩니다.</p><p><a class="btn primary" href="/store">스토어로 돌아가기</a></p>`;return}
  ORDERS.add(o);
  try{const bought=new Set(o.books.map(b=>b.id));const c=JSON.parse(localStorage.getItem("hr-cart")||"[]").filter(id=>!bought.has(id));localStorage.setItem("hr-cart",JSON.stringify(c));localStorage.removeItem("hr-bump");localStorage.removeItem("hr-pending")}catch(e){}
  history.replaceState(null,"","/pay/success?"+(o.ticket?"t="+encodeURIComponent(o.ticket):"orderId="+encodeURIComponent(o.orderId)));
  out.innerHTML=`<h1>결제가 완료됐어요</h1><p class="sub">아래 버튼으로 바로 내려받으세요. 전자책은 폰이면 PDF, 리더기면 EPUB이 편해요. 합격플랜은 zip을 풀고 HTML 파일을 여세요.</p>
  <section class="card">${booksHtml(o)}</section>
  <section class="card">${orderMeta(o)}<p class="note">이 기기의 <a href="/orders">구매내역</a>에 저장돼서 언제든 다시 받을 수 있어요. 다른 기기에서 받으려면 지금 이 화면 주소를 즐겨찾기하거나 나에게 보내 두세요.${o.receipt?` · <a href="${esc(o.receipt)}" target="_blank" rel="noopener">영수증 보기</a>`:""}</p></section>`;
})();
</script>
</body>
</html>

<title>전자책 공장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a production line — station rail on the left (top strip on phones), one workbench on the right */
:root{
  --paper:#F5F4EE; --sheet:#FFFFFF; --ink:#1A222B; --muted:#5E6A72; --line:#DCDCD2;
  --cloth:#1F6B52; --cloth-ink:#FFFFFF; --cloth-soft:#E3EFE9; --gold:#C98A0E; --warn:#B4441F; --ok:#2C7A4B;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-book:"Gowun Batang","Nanum Myeongjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171C; --sheet:#1A2128; --ink:#E9EAE4; --muted:#9AA6AD; --line:#2C363F;
  --cloth:#47A783; --cloth-ink:#0D1A14; --cloth-soft:#1C3229; --gold:#E2AC3C; --warn:#E37A55; --ok:#5DBB83; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171C; --sheet:#1A2128; --ink:#E9EAE4; --muted:#9AA6AD; --line:#2C363F;
  --cloth:#47A783; --cloth-ink:#0D1A14; --cloth-soft:#1C3229; --gold:#E2AC3C; --warn:#E37A55; --ok:#5DBB83; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:12px;height:22px;background:var(--cloth);border-radius:2px;box-shadow:5px 0 0 var(--gold)}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--cloth);color:var(--cloth)}
.chip.bad{border-color:var(--warn);color:var(--warn)}
select.book{max-width:220px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.btn{border:1px solid var(--line);background:var(--sheet);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--cloth);color:var(--cloth-ink);border-color:var(--cloth)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:#1A1406;border-color:var(--gold);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;
  padding-left:max(12px,env(safe-area-inset-left,0px))}
.rail .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 8px 8px}
.st{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:9px 8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;background:none;text-align:left}
.st:hover{background:var(--sheet)}
.st.cur{background:var(--sheet);border-color:var(--line)}
.st b{font-weight:600;display:block;font-size:14px}
.st small{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.st.done .dot{background:var(--cloth);border-color:var(--cloth);color:var(--cloth-ink)}
.st.busy .dot{border-color:var(--gold);color:var(--gold);animation:spin 1.2s linear infinite;border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st.busy .dot{animation:none}}
.rail .meter{margin:18px 8px 0;font-size:12px;color:var(--muted)}
.rail .meter .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.rail .meter .bar span{display:block;height:100%;background:var(--cloth);width:0}
main{padding-block:24px 60px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.bench{max-width:980px}
h1.sh{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 4px;text-wrap:balance;letter-spacing:.3px}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:13px;font-weight:600}
.f .hint{font-size:12px;color:var(--muted)}
.in,textarea.in,select.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
textarea.in{resize:vertical;min-height:80px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.sep{height:1px;background:var(--line);margin:6px 0}
.plabel{font-size:13px;font-weight:600;color:var(--muted)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pc{padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--sheet);cursor:pointer;font-size:14px}
.pc:hover{border-color:var(--cloth)}
.pc.sel{background:var(--cloth);border-color:var(--cloth);color:var(--cloth-ink);font-weight:600}
.titles{display:flex;flex-direction:column;gap:8px}
.tpick{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--sheet);text-align:left;width:100%}
.tpick:hover{border-color:var(--cloth)}
.tpick.sel{border-color:var(--cloth);background:var(--cloth-soft)}
.tpick b{font-family:var(--f-book);font-size:17px}
.tpick span{display:block;font-size:13px;color:var(--muted)}
.toc{display:flex;flex-direction:column;gap:8px;counter-reset:ch}
.tocrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.tocrow .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:9px;text-align:right}
.tocrow .acts{display:flex;gap:4px;padding-top:4px}
.ib{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);background:none;cursor:pointer;color:var(--muted)}
.ib:hover{color:var(--ink);border-color:var(--ink)}
.writer{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px}
.chlist{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}
.chi{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:8px 10px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer;text-align:left;font-size:14px}
.chi:hover{background:var(--sheet)}
.chi.cur{background:var(--sheet);border-color:var(--line)}
.chi .s{width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--line)}
.chi.done .s{background:var(--ok)}
.chi.busy .s{background:var(--gold)}
.chi small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.manu{font-family:var(--f-book);font-size:16.5px;line-height:1.85;min-height:52vh}
.prev{font-family:var(--f-book);font-size:16.5px;line-height:1.9;max-width:66ch}
.prev h2,.prev h3{font-family:var(--f-ui);line-height:1.35;text-wrap:balance}
.prev blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--cloth);color:var(--muted)}
.cvwrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
.cvbox{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;place-items:center}
#cv{width:100%;max-width:280px;aspect-ratio:1/1.6;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05)}
.tpls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tpl{padding:10px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);cursor:pointer;font-size:13px}
.tpl.sel{border-color:var(--cloth);background:var(--cloth-soft);font-weight:600}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.sel{box-shadow:0 0 0 2px var(--ink)}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw span{background:var(--cloth-soft);color:var(--ink);padding:3px 10px;border-radius:99px;font-size:13px}
.chan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chan div{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);font-size:13px}
.chan b{display:block;font-size:14px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks div{display:flex;gap:8px;align-items:center}
.checks .y{color:var(--ok);font-weight:700}
.checks .x{color:var(--warn);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.exp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exp button{text-align:left;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);cursor:pointer}
.exp button:hover{border-color:var(--cloth)}
.exp button b{display:block}
.exp button span{font-size:13px;color:var(--muted)}
.exp button.main{border-color:var(--cloth);background:var(--cloth-soft)}
.note{font-size:13px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);border:1px dashed var(--gold);font-size:13px;margin-bottom:16px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.runbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--sheet);border:1px solid var(--gold);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.15);max-width:calc(100% - 32px)}
.runbar span{font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--warn)}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:2px}
  .rail .lbl,.rail .meter{display:none}
  .st{grid-template-columns:24px auto;flex:0 0 auto}
  .st small{display:none}
  .dot{width:24px;height:24px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .grid2,.grid3,.cvwrap,.writer,.chan,.exp{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chlist{max-height:none;flex-direction:row;overflow-x:auto}
  .chi{flex:0 0 auto;max-width:200px}
  .brand{font-size:19px}
}
</style>

<header class="top">
  <div class="brand"><i aria-hidden="true"></i>전자책 공장</div>
  <span id="aiChip" class="chip">AI 연결 확인 중</span>
  <select id="bookSel" class="book" aria-label="작업 중인 책"></select>
  <button class="btn sm" id="newBook">새 책</button>
  <button class="btn gold" id="autoRun">원클릭 자동 생산</button>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="생산 단계">
    <div class="lbl">생산 라인</div>
  </nav>
  <main><div class="bench" id="bench"></div></main>
</div>
<div id="runbar" class="runbar" hidden><span id="runMsg">작업 중</span><button class="btn sm" id="stopBtn">중지</button></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const KEY="ebookfactory.v1";

/* ---------- 예시 책 (처음 열었을 때 보여줄 견본) ---------- */
function exampleBook(){return{
  id:"example",example:true,idea:"직장인이 퇴근 후 시간으로 전자책을 써서 부수입을 만드는 방법",
  audience:"부업을 찾는 30~40대 직장인",tone:"친근하고 실전적인",chapterCount:6,chars:3000,withIntro:true,
  title:"퇴근 후 2시간, 전자책 한 권",subtitle:"주제 고르기부터 판매까지, 직장인 전자책 부업 로드맵",author:"홍길동",
  concept:"경험 하나를 상품으로 바꾸는 가장 빠른 길",titleOptions:[],
  chapters:[
    {title:"들어가며: 왜 지금 전자책인가",summary:"전자책 부업이 직장인에게 맞는 이유",body:"## 하루 2시간이면 충분하다\n\n대부분의 부업은 시간을 판다. 전자책은 다르다. **한 번 써 두면** 잠자는 동안에도 팔린다.\n\n- 초기 비용이 거의 없다\n- 회사 일과 겹치지 않는다\n- 내 경험이 곧 재료다\n\n> 이 책은 예시 원고입니다. 직접 만들려면 상단의 ‘새 책’을 누르세요."},
    {title:"1장. 팔리는 주제 찾기",summary:"검색 수요와 내 경험이 겹치는 지점 찾기",body:""},
    {title:"2장. 목차가 책의 80%다",summary:"독자의 문제 순서대로 목차 짜는 법",body:""},
    {title:"3장. AI와 함께 초고 쓰기",summary:"AI로 초고를 만들고 내 목소리로 다듬기",body:""},
    {title:"4장. 표지와 상세페이지",summary:"클릭을 부르는 표지와 판매 문구",body:""},
    {title:"마치며: 두 번째 책은 더 쉽다",summary:"시리즈로 확장하는 전략",body:""}],
  cover:{tpl:"classic",color:"#1F4E79"},sales:null,aiNote:true,updatedAt:Date.now()};}

/* ---------- 저장소 ---------- */
let lib=[],cur=null,station="plan",curCh=0,previewMode=false;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&Array.isArray(d.books)&&d.books.length){lib=d.books;return d.cur}}catch(e){}lib=[exampleBook()];return "example";}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{cur.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify({books:lib,cur:cur.id}))}catch(e){}},300);}
function blank(){return{id:uid(),idea:"",audience:"",tone:"친근하고 실전적인",chapterCount:8,chars:3500,withIntro:true,title:"",subtitle:"",author:"",concept:"",titleOptions:[],chapters:[],cover:{tpl:"classic",color:"#1F6B52"},sales:null,aiNote:true,updatedAt:Date.now()};}

/* ---------- AI (Claude) ---------- */
let samplePromise=null,aiState="wait";
function getSample(){if(!samplePromise){samplePromise=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);}return samplePromise;}
getSample().then(s=>{aiState=s?"ok":"none";paintChip();if(!s)render();});
function paintChip(){const c=$("#aiChip");c.className="chip"+(aiState==="ok"?" on":aiState==="none"||aiState==="denied"?" bad":"");
  c.textContent=aiState==="ok"?"AI 연결됨":aiState==="none"?"AI 사용 불가 (수동 모드)":aiState==="denied"?"AI 사용이 거절됨":"AI 연결 확인 중";}
const ERR={not_granted:"AI 사용이 허용되지 않았어요. 다시 열고 ‘허용’을 눌러 주세요.",rate_limited:"요청이 많아요. 1분 뒤 다시 눌러 주세요.",invalid_json:"AI 답변 형식이 어긋났어요. 한 번 더 눌러 주세요.",cancelled:"중지했어요.",prompt_too_large:"내용이 너무 길어요. 분량을 줄여 주세요.",refused:"AI가 이 주제는 쓰지 않겠다고 답했어요. 주제를 바꿔 주세요.",unavailable:"이 화면에서는 AI를 쓸 수 없어요. 직접 입력해서 만들 수 있어요."};
const errMsg=e=>ERR[e&&e.code]||("문제가 생겼어요: "+((e&&e.message)||"알 수 없는 오류"));
let ctl=null;
async function ask(prompt,{json=false,onText,tier="default"}={}){
  const s=await getSample();if(!s)throw{code:"unavailable"};
  ctl=new AbortController();
  try{return json?await s.json(prompt,{signal:ctl.signal,modelTier:tier,onText}):await s(prompt,{signal:ctl.signal,modelTier:tier,onText});}
  catch(e){if(e&&e.code==="not_granted"){aiState="denied";paintChip();}throw e;}
}
let busy=null; // {what, ch}
function setBusy(b,msg){busy=b;$("#runbar").hidden=!b;if(msg)$("#runMsg").textContent=msg;$("#autoRun").disabled=!!b;paintRail();}
$("#stopBtn").onclick=()=>{stopAll=true;ctl&&ctl.abort();};
let stopAll=false;

function bookBrief(b){return `[책 정보]\n- 제목: ${b.title||"(미정)"}\n- 부제: ${b.subtitle||""}\n- 분야: ${b.category||""}\n- 주제: ${b.idea}\n- 독자: ${b.audience}\n- 문체: ${b.tone}\n- 콘셉트: ${b.concept||""}`;}

async function genPlan(){
  const b=cur;if(!b.idea.trim()){toast("먼저 ‘책 주제’를 적어 주세요.");return false;}
  setBusy({what:"plan"},"제목과 콘셉트를 뽑는 중");
  try{

async function genOutline(){

    const n=Math.max(3,Math.min(20,+b.chapterCount||8));
    const r=await ask(`당신은 베스트셀러 실용서 편집자입니다. 아래 책의 목차를 짜세요.\n${bookBrief(b)}\n\n규칙:\n- 본문 장은 정확히 ${n}개. 제목 앞에 "1장. " 같은 번호를 붙이세요.\n- ${b.withIntro?'맨 앞에 "들어가며: …", 맨 뒤에 "마치며: …" 를 추가하세요(번호 없음).':"들어가며/마치며는 넣지 마세요."}\n- 독자의 문제를 해결하는 순서로, 장마다 구체적인 결과가 보이게.\n- summary는 그 장에서 다룰 내용 한 문장, points는 소제목 3~4개.\n\n오직 JSON으로: {"chapters":[{"title":"","summary":"","points":["",""]}]}`,{json:true});
    if(!r||!Array.isArray(r.chapters)||!r.chapters.length)throw{code:"invalid_json"};
    b.chapters=r.chapters.map(c=>({title:String(c.title||"제목 없음"),summary:String(c.summary||""),points:Array.isArray(c.points)?c.points.map(String):[],body:""}));
    curCh=0;save();return true;
  }catch(e){toast(errMsg(e));return false;}finally{setBusy(null);render();}
}
async function genChapter(i,extra){
  const b=cur,c=b.chapters[i];if(!c)return false;
  setBusy({what:"write",ch:i},`원고 쓰는 중: ${c.title}`);
  const toc=b.chapters.map((x,j)=>`${j===i?"▶ ":""}${x.title} — ${x.summary}`).join("\n");
  const prev=i>0&&b.chapters[i-1].body?b.chapters[i-1].body.slice(-600):"";
  const old=extra&&c.body?`\n\n[기존 원고]\n${c.body.slice(0,9000)}\n\n[수정 요청]\n${extra}\n위 요청대로 기존 원고를 고쳐 쓴 전체 원고를 주세요.`:"";
  const prompt=`당신은 이 책의 저자입니다. 아래 한 장의 원고를 한국어로 쓰세요.\n${bookBrief(b)}\n\n[전체 목차]\n${toc}\n\n[이번에 쓸 장]\n제목: ${c.title}\n내용: ${c.summary}\n소제목 후보: ${(c.points||[]).join(", ")}\n${prev?`\n[앞 장의 끝부분 — 자연스럽게 이어지게]\n${prev}\n`:""}\n규칙:\n- 분량: 공백 포함 약 ${b.chars}자.\n- 형식: 마크다운. 장 제목은 쓰지 말고 바로 본문 시작. 소제목은 "## ", 하위는 "### ".\n- 구체적인 예시, 단계, 체크리스트를 넣고 뻔한 일반론은 피하세요.\n- 확인할 수 없는 통계나 실명 사례를 지어내지 마세요.\n- 장 끝에 "## 이 장의 핵심" 으로 3줄 요약.\n- 원고 외의 말(인사, 설명)은 쓰지 마세요.${old}`;
  try{
    const r=await ask(prompt,{onText:({text})=>{c.body=text;liveUpdate(i);}});
    c.body=r.text.trim();save();return true;
  }catch(e){if(e&&e.text)c.body=e.text;save();if(e.code!=="cancelled")toast(errMsg(e));return false;}
  finally{setBusy(null);render();}
}
async function genSales(){

    if(!r||!r.detail)throw{code:"invalid_json"};
    b.sales={hook:String(r.hook||""),detail:String(r.detail||""),keywords:(r.keywords||[]).map(String),price:String(r.price||""),blurb:String(r.blurb||"")};

async function autoRun(){
  if(cur.example){toast("예시 책은 자동 생산할 수 없어요. ‘새 책’을 눌러 주세요.");return;}
  if(!cur.idea.trim()){station="plan";render();toast("‘책 주제’ 한 줄만 적으면 나머지는 자동으로 만들어요.");$("#idea")&&$("#idea").focus();return;}
  stopAll=false;
  if(!cur.title){station="plan";render();if(!await genPlan()||stopAll)return;}
  if(!cur.chapters.length){station="toc";render();if(!await genOutline()||stopAll)return;}
  station="write";
  for(let i=0;i<cur.chapters.length;i++){
    if(cur.chapters[i].body.trim())continue;
    curCh=i;render();if(!await genChapter(i)||stopAll)return;
  }
  station="sales";render();if(!cur.sales){if(!await genSales()||stopAll)return;}
  station="ship";render();toast("책 한 권이 완성됐어요. ‘EPUB 내려받기’를 누르세요.");
}

const doneCh=b=>b.chapters.filter(c=>c.body.trim().length>200).length;

function stationState(k){const b=cur;
  if(busy&&({plan:"plan",toc:"toc",write:"write",sales:"sales"})[k]===busy.what)return"busy";
  if(k==="plan")return b.title&&b.idea?"done":"";
  if(k==="toc")return b.chapters.length?"done":"";

  if(k==="cover")return b.title?"done":"";

  const r=$("#rail");const pct=cur.chapters.length?Math.round(doneCh(cur)/cur.chapters.length*100):0;

let pickCat=null,pickSub=null;const aiTopics={};
function pickerHtml(){

  const cat=CATS.find(c=>c.k===pickCat);const subs=cat?Object.keys(cat.subs):[];

  return `<div class="card stack" id="picker">
  <div class="row" style="justify-content:space-between"><b>주제 고르기</b><span class="note">분야 → 세부 분야 → 주제 순서로 누르세요</span></div>
  <div class="f"><span class="plabel">① 분야</span><div class="pchips">${CATS.map(c=>`<button class="pc ${c.k===pickCat?"sel":""}" data-cat="${esc(c.k)}">${esc(c.k)}</button>`).join("")}</div></div>
  ${cat?`<div class="f"><span class="plabel">② 세부 분야</span><div class="pchips">${subs.map(s=>`<button class="pc ${s===pickSub?"sel":""}" data-sub="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`:""}
  ${pickSub?`<div class="f"><span class="plabel">③ 주제</span><div class="titles">${topics.map((t,i)=>{const[ti,au]=t.split("|");return `<button class="tpick ${cur.idea===ti?"sel":""}" data-topic="${i}"><div><b style="font-size:16px">${esc(ti)}</b><span>독자: ${esc(au||"")}</span></div></button>`;}).join("")}</div>
  <div class="row"><button class="btn sm" id="moreTopics" ${aiOff()||busy?"disabled":""}>AI에게 주제 6개 더 받기</button></div></div>`:""}
</div>`;}
async function moreTopics(){const key=pickCat+"/"+pickSub,have=[...CATS.find(c=>c.k===pickCat).subs[pickSub],...(aiTopics[key]||[])].map(t=>t.split("|")[0]);
  setBusy({what:"plan"},"주제를 더 찾는 중");
  try{const r=await ask(`한국 전자책 시장(크몽, 리디, 교보, 유페이퍼)에서 잘 팔릴 전자책 주제를 추천하세요.\n분야: ${pickCat} > ${pickSub}\n이미 있는 주제(겹치지 않게): ${have.join(" / ")}\n\n구체적인 결과나 대상이 드러나는 주제 6개. 오직 JSON으로: [{"topic":"주제","audience":"핵심 독자"}]`,{json:true,tier:"quick"});
    if(!Array.isArray(r))throw{code:"invalid_json"};aiTopics[key]=[...(aiTopics[key]||[]),...r.filter(x=>x&&x.topic).map(x=>`${x.topic}|${x.audience||""}`)];
  }catch(e){toast(errMsg(e));}finally{setBusy(null);render();}}
function bindPicker(){const b=cur;
  document.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>{pickCat=x.dataset.cat;pickSub=null;render();});
  document.querySelectorAll("[data-sub]").forEach(x=>x.onclick=()=>{pickSub=x.dataset.sub;render();});
  document.querySelectorAll("[data-topic]").forEach(x=>x.onclick=()=>{const cat=CATS.find(c=>c.k===pickCat);const list=[...cat.subs[pickSub],...(aiTopics[pickCat+"/"+pickSub]||[])];const[ti,au]=list[+x.dataset.topic].split("|");
    if(b.example){const nb=blank();lib.push(nb);cur=nb;}
    const c=cur;const changed=c.idea!==ti;c.idea=ti;c.audience=au||"";c.tone=cat.tone||c.tone;c.category=pickCat+" > "+pickSub;
    if(changed&&!c.chapters.length){c.title="";c.subtitle="";c.titleOptions=[];c.concept="";}
    save();render();toast("주제를 골랐어요. ‘원클릭 자동 생산’을 누르면 책 한 권이 만들어져요.");});
  const m=$("#moreTopics");if(m)m.onclick=moreTopics;}

function lum(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255;}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));return`rgb(${f(r)},${f(g)},${f(b)})`;}
function wrapText(ctx,text,maxW){const words=String(text).split(/\s+/).filter(Boolean),lines=[];let line="";
  const push=w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width<=maxW){line=t;return;}if(line)lines.push(line);
    if(ctx.measureText(w).width<=maxW){line=w;return;}let part="";for(const ch of w){if(ctx.measureText(part+ch).width>maxW){lines.push(part);part=ch;}else part+=ch;}line=part;};
  words.forEach(push);if(line)lines.push(line);return lines;}
function fitTitle(ctx,text,font,maxW,maxLines,start,min){let s=start,lines;do{ctx.font=`${s}px ${font}`;lines=wrapText(ctx,text,maxW);if(lines.length<=maxLines)break;s-=8;}while(s>min);return{size:s,lines};}
function seedRand(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
let fontsReady=document.fonts?Promise.all([document.fonts.load('80px "Black Han Sans"','가'),document.fonts.load('700 80px "Gowun Batang"','가'),document.fonts.load('500 40px "IBM Plex Sans KR"','가')]).catch(()=>{}):Promise.resolve();
async function drawCover(cv){await fontsReady;const b=cur,ctx=cv.getContext("2d"),W=cv.width,H=cv.height,col=b.cover.color,light=lum(col)>0.6;
  const fg=light?"#1A222B":"#FFFFFF",soft=light?"rgba(26,34,43,.65)":"rgba(255,255,255,.75)";const title=b.title||"제목을 정해 주세요",sub=b.subtitle||"",au=b.author||"";
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
  if(b.cover.tpl==="classic"){
    ctx.fillStyle=col;ctx.fillRect(0,0,W,H);ctx.strokeStyle=soft;ctx.lineWidth=6;ctx.strokeRect(90,90,W-180,H-180);ctx.lineWidth=2;ctx.strokeRect(115,115,W-230,H-230);
    ctx.fillStyle=fg;ctx.textAlign="center";const t=fitTitle(ctx,title,'"Gowun Batang",serif',W-360,4,190,90);ctx.font=`700 ${t.size}px "Gowun Batang",serif`;
    const lh=t.size*1.3,top=H*0.36-(t.lines.length-1)*lh/2;t.lines.forEach((l,i)=>ctx.fillText(l,W/2,top+i*lh));
    const yy=top+(t.lines.length-1)*lh+110;ctx.fillRect(W/2-90,yy,180,5);
    if(sub){ctx.fillStyle=soft;ctx.font='500 56px "IBM Plex Sans KR",sans-serif';wrapText(ctx,sub,W-420).slice(0,3).forEach((l,i)=>ctx.fillText(l,W/2,yy+120+i*80));}
    ctx.fillStyle=fg;ctx.font='500 64px "IBM Plex Sans KR",sans-serif';ctx.fillText(au,W/2,H-260);
  }else if(b.cover.tpl==="block"){
    ctx.fillStyle="#F3F1EA";ctx.fillRect(0,0,W,H);ctx.fillStyle=col;ctx.fillRect(0,0,W,H*0.62);
    const bfg=light?"#1A222B":"#FFFFFF";ctx.fillStyle=bfg;const t=fitTitle(ctx,title,'"Black Han Sans",sans-serif',W-260,4,230,100);ctx.font=`${t.size}px "Black Han Sans",sans-serif`;
    const lh=t.size*1.12;let y=H*0.62-110-(t.lines.length-1)*lh;t.lines.forEach((l,i)=>ctx.fillText(l,130,y+i*lh));
    ctx.fillStyle="#1A222B";if(sub){ctx.font='500 60px "IBM Plex Sans KR",sans-serif';wrapText(ctx,sub,W-260).slice(0,3).forEach((l,i)=>ctx.fillText(l,130,H*0.62+180+i*86));}
    ctx.fillStyle=col;ctx.fillRect(130,H-330,120,8);ctx.fillStyle="#1A222B";ctx.font='600 62px "IBM Plex Sans KR",sans-serif';ctx.fillText(au,130,H-220);
  }else if(b.cover.tpl==="type"){
    ctx.fillStyle="#15191E";ctx.fillRect(0,0,W,H);ctx.fillStyle=col;ctx.fillRect(0,H-520,W,24);ctx.fillRect(0,H-470,W*0.55,24);
    ctx.fillStyle=light||lum(col)>0.35?col:shade(col,0.45);const t=fitTitle(ctx,title,'"Black Han Sans",sans-serif',W-200,6,300,110);ctx.font=`${t.size}px "Black Han Sans",sans-serif`;
    const lh=t.size*1.05;t.lines.forEach((l,i)=>ctx.fillText(l,100,260+t.size+i*lh));
    ctx.fillStyle="rgba(255,255,255,.8)";if(sub){ctx.font='500 58px "IBM Plex Sans KR",sans-serif';wrapText(ctx,sub,W-200).slice(0,2).forEach((l,i)=>ctx.fillText(l,100,H-300+i*80));}
    ctx.fillStyle="#FFFFFF";ctx.font='600 60px "IBM Plex Sans KR",sans-serif';ctx.fillText(au,100,H-120);
  }else{
    ctx.fillStyle=col;ctx.fillRect(0,0,W,H);const rnd=seedRand(title);

    ctx.fillStyle=light?"#1A222B":"#FFFFFF";ctx.globalAlpha=.94;ctx.fillRect(0,H*0.58,W,H*0.42);ctx.globalAlpha=1;
    ctx.fillStyle=light?"#FFFFFF":"#1A222B";const t=fitTitle(ctx,title,'"Gowun Batang",serif',W-260,3,170,90);ctx.font=`700 ${t.size}px "Gowun Batang",serif`;
    const lh=t.size*1.28;t.lines.forEach((l,i)=>ctx.fillText(l,130,H*0.58+120+t.size*0.8+i*lh));
    const yb=H*0.58+120+t.size*0.8+(t.lines.length-1)*lh;
    if(sub){ctx.globalAlpha=.7;ctx.font='500 54px "IBM Plex Sans KR",sans-serif';wrapText(ctx,sub,W-260).slice(0,2).forEach((l,i)=>ctx.fillText(l,130,yb+110+i*76));ctx.globalAlpha=1;}
    ctx.font='600 60px "IBM Plex Sans KR",sans-serif';ctx.fillText(au,130,H-150);
  }
}

  $("#xMd").onclick=()=>offer(fname("원고","md"),new Blob([buildMd(b)],{type:"text/markdown"}));
  $("#xSales").onclick=()=>{if(!b.sales){toast("판매 문구를 먼저 만들어 주세요.");return;}const s=b.sales;offer(fname("판매문구","txt"),new Blob([`[한 줄 카피]\n${s.hook}\n\n[추천 가격]\n${s.price}\n\n[검색 키워드]\n${s.keywords.join(", ")}\n\n[서점 등록용 소개]\n${s.blurb}\n\n[상세페이지]\n${s.detail}\n`],{type:"text/plain"}));};
  $("#xJson").onclick=()=>offer(fname("백업","json"),new Blob([JSON.stringify(b,null,1)],{type:"application/json"}));
  $("#xLoad").onclick=()=>$("#loadFile").click();
  $("#loadFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.chapters))throw 0;d.id=uid();d.example=false;d.updatedAt=Date.now();d.cover=d.cover||{tpl:"classic",color:"#1F6B52"};lib.push(d);cur=d;station="plan";save();render();toast("불러왔어요: "+(d.title||"제목 미정"));}catch(_){toast("이 파일은 전자책 공장 백업 파일이 아니에요.");}};
  $("#delBook").onclick=()=>{$("#delConfirm").innerHTML=`<span class="confirm">정말 삭제할까요? 되돌릴 수 없어요. <button class="btn sm" id="delYes">삭제</button><button class="btn sm ghost" id="delNo">취소</button></span>`;
    $("#delNo").onclick=()=>$("#delConfirm").innerHTML="";$("#delYes").onclick=()=>{lib=lib.filter(x=>x.id!==b.id);if(!lib.length)lib=[exampleBook()];cur=lib[0];station="plan";save();render();toast("삭제했어요.");};};
};

/* ---------- 마크다운 → XHTML ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");}
function md2html(md){if(!md)return"";const L=md.replace(/\r/g,"").split("\n");let out=[],para=[],list=null;
  const fp=()=>{if(para.length){out.push(`<p>${inline(para.join(" "))}</p>`);para=[];}};const fl=()=>{if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`);list=null;}};
  for(const raw of L){const l=raw.trim();let m;
    if(!l){fp();fl();continue;}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){fp();fl();const lv=Math.min(4,m[1].length+1);out.push(`<h${lv}>${inline(m[2])}</h${lv}>`);continue;}
    if((m=l.match(/^[-*•]\s+(.*)$/))){fp();if(!list||list.t!=="ul"){fl();list={t:"ul",items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^\d+[.)]\s+(.*)$/))){fp();if(!list||list.t!=="ol"){fl();list={t:"ol",items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^>\s?(.*)$/))){fp();fl();out.push(`<blockquote><p>${inline(m[1])}</p></blockquote>`);continue;}
    if(/^(-{3,}|\*{3,})$/.test(l)){fp();fl();out.push("<hr/>");continue;}
    fl();para.push(l);}
  fp();fl();return out.join("\n");}

/* ---------- 파일 만들기 ---------- */
const today=()=>new Date().toISOString().slice(0,10);
function fname(tag,ext){const t=(cur.title||"전자책").replace(/[\\/:*?"<>|]/g,"").slice(0,40).trim()||"전자책";return `${t}${tag?"_"+tag:""}.${ext}`;}
function copyrightHtml(b){return `<p><strong>${esc(b.title)}</strong></p>${b.subtitle?`<p>${esc(b.subtitle)}</p>`:""}<p>지은이 ${esc(b.author||"")}</p><p>펴낸날 ${today()}</p><p>이 책의 저작권은 지은이에게 있습니다. 무단 전재와 복제를 금합니다.</p>${b.aiNote?"<p>이 책은 AI 도구를 활용해 기획·집필되었으며, 지은이가 검토하고 편집했습니다.</p>":""}`;}
const CSS=`body{font-family:serif;line-height:1.8;margin:0 5%;word-break:keep-all}h1{font-size:1.6em;margin:2em 0 1em;line-height:1.4}h2{font-size:1.25em;margin:1.8em 0 .6em}h3{font-size:1.1em;margin:1.4em 0 .5em}p{margin:0 0 .9em;text-indent:0}blockquote{margin:1em 0;padding-left:1em;border-left:3px solid #999;color:#444}.cover{margin:0;padding:0;text-align:center}.cover img{max-width:100%;height:auto}.title{text-align:center;margin-top:30%}.title h1{font-size:2em}.copy{margin-top:40%;font-size:.85em}nav ol{list-style:none;padding:0}nav li{margin:.4em 0}`;
const xhtml=(title,body,extra="")=>`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="ko" lang="ko"><head><meta charset="UTF-8"/><title>${esc(title)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body${extra}>${body}</body></html>`;
async function buildEpub(b){if(typeof JSZip==="undefined")throw new Error("압축 도구를 불러오지 못했어요. 새로고침해 주세요.");
  const zip=new JSZip(),id="urn:uuid:"+(crypto.randomUUID?crypto.randomUUID():uid()),title=b.title||"제목 없음";
  zip.file("mimetype","application/epub+zip",{compression:"STORE"});
  zip.file("META-INF/container.xml",`<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);
  const O=zip.folder("OEBPS");O.file("style.css",CSS);O.file("cover.jpg",await (await coverBlob()).arrayBuffer());
  O.file("cover.xhtml",xhtml("표지",`<div class="cover"><img src="cover.jpg" alt="${esc(title)} 표지"/></div>`," class=\"cover\""));
  O.file("title.xhtml",xhtml(title,`<div class="title"><h1>${esc(title)}</h1>${b.subtitle?`<p>${esc(b.subtitle)}</p>`:""}<p>${esc(b.author||"")}</p></div><div class="copy">${copyrightHtml(b)}</div>`));
  b.chapters.forEach((c,i)=>O.file(`ch${i+1}.xhtml`,xhtml(c.title,`<section epub:type="chapter"><h1>${esc(c.title)}</h1>${md2html(c.body)}</section>`)));
  O.file("nav.xhtml",xhtml("목차",`<nav epub:type="toc" id="toc"><h1>목차</h1><ol>${b.chapters.map((c,i)=>`<li><a href="ch${i+1}.xhtml">${esc(c.title)}</a></li>`).join("")}</ol></nav>`));
  O.file("toc.ncx",`<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="${id}"/></head><docTitle><text>${esc(title)}</text></docTitle><navMap>${b.chapters.map((c,i)=>`<navPoint id="n${i+1}" playOrder="${i+1}"><navLabel><text>${esc(c.title)}</text></navLabel><content src="ch${i+1}.xhtml"/></navPoint>`).join("")}</navMap></ncx>`);
  const mod=new Date().toISOString().replace(/\.\d+Z$/,"Z");
  O.file("content.opf",`<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid" xml:lang="ko"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bookid">${id}</dc:identifier><dc:title>${esc(title)}</dc:title><dc:creator>${esc(b.author||"")}</dc:creator><dc:language>ko</dc:language>${b.sales&&b.sales.blurb?`<dc:description>${esc(b.sales.blurb)}</dc:description>`:""}<meta property="dcterms:modified">${mod}</meta><meta name="cover" content="cover-img"/></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/><item id="css" href="style.css" media-type="text/css"/><item id="cover-img" href="cover.jpg" media-type="image/jpeg" properties="cover-image"/><item id="cover" href="cover.xhtml" media-type="application/xhtml+xml"/><item id="title" href="title.xhtml" media-type="application/xhtml+xml"/>${b.chapters.map((c,i)=>`<item id="ch${i+1}" href="ch${i+1}.xhtml" media-type="application/xhtml+xml"/>`).join("")}</manifest><spine toc="ncx"><itemref idref="cover" linear="yes"/><itemref idref="title"/><itemref idref="nav"/>${b.chapters.map((c,i)=>`<itemref idref="ch${i+1}"/>`).join("")}</spine></package>`);
  return zip.generateAsync({type:"blob",mimeType:"application/epub+zip",compression:"DEFLATE"});}
function blobToDataURL(bl){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(bl);});}
async function buildPrintHtml(b){const cover=await blobToDataURL(await coverBlob());
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(b.title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"><style>@page{size:A5;margin:18mm 16mm}body{font-family:"Gowun Batang",serif;font-size:10.5pt;line-height:1.85;word-break:keep-all;max-width:150mm;margin:0 auto}h1{font-size:18pt;page-break-before:always;margin-top:30mm}h2{font-size:13pt;margin-top:1.6em}h3{font-size:11.5pt}.cv{page-break-after:always;text-align:center}.cv img{max-height:190mm}.tp{text-align:center;margin-top:50mm}.tp h1{page-break-before:avoid;margin:0;font-size:24pt}.copy{margin-top:60mm;font-size:9pt}ol{line-height:2}blockquote{border-left:3px solid #999;margin:1em 0;padding-left:1em;color:#444}</style></head><body><div class="cv"><img src="${cover}" alt="표지"></div><div class="tp"><h1>${esc(b.title)}</h1><p>${esc(b.subtitle)}</p><p>${esc(b.author)}</p></div><div class="copy">${copyrightHtml(b)}</div><h1>목차</h1><ol>${b.chapters.map(c=>`<li>${esc(c.title)}</li>`).join("")}</ol>${b.chapters.map(c=>`<h1>${esc(c.title)}</h1>${md2html(c.body)}`).join("\n")}</body></html>`;}
function buildMd(b){return `# ${b.title}\n\n${b.subtitle?`*${b.subtitle}*\n\n`:""}지은이: ${b.author}\n\n`+b.chapters.map(c=>`# ${c.title}\n\n${c.body}\n`).join("\n");}

/* ---------- 내려받기·복사·알림 ---------- */
let dlP=null;const getDl=()=>dlP||(dlP=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null));
async function offer(name,blob){const d=await getDl();if(!d){toast("이 화면에서는 파일 저장을 쓸 수 없어요. Claude 앱이나 claude.ai에서 열어 주세요.");return;}
  try{await d.save({filename:name,data:blob});toast("저장했어요: "+name);}catch(e){if(e&&e.code&&e.code!=="cancelled"&&e.code!=="declined")toast("저장하지 못했어요 ("+e.code+")");}}
async function copy(text,btn){try{await navigator.clipboard.writeText(text);btn.textContent="복사됨";setTimeout(()=>btn.textContent="복사",1500);}catch(e){toast("복사가 막혀 있어요. 글을 길게 눌러 직접 복사해 주세요.");}}
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3800);}

/* ---------- 시작 ---------- */
const cid=load();cur=lib.find(b=>b.id===cid)||lib[0];
render();
})();
</script>

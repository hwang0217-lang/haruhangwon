<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 · 하루한권 합격플랜</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
:root{--bg:#F7F7F4;--card:#fff;--ink:#18202B;--muted:#5C6672;--line:#E0E2DD;--soft:#EFEFEA;--lamp:#F2B84B;--lamp-ink:#1D1606;--accent:#2D4FC4;--ok:#2F7D4F;--bad:#B3261E;
--f-book:"Gowun Batang",serif;--f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141C;--card:#171F2A;--ink:#E7EAEF;--muted:#9AA4B0;--line:#283241;--soft:#1C2531;--accent:#8AA0F5;--ok:#6CCB92;--bad:#F2928A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141C;--card:#171F2A;--ink:#E7EAEF;--muted:#9AA4B0;--line:#283241;--soft:#1C2531;--accent:#8AA0F5;--ok:#6CCB92;--bad:#F2928A;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.7;word-break:keep-all}
.in{max-width:640px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}header .in{display:flex;justify-content:space-between;align-items:center;height:60px;max-width:1120px}
.logo{font-weight:700;text-decoration:none;color:inherit;font-size:19px}.logo b{color:var(--accent)}
nav a{color:var(--muted);text-decoration:none;font-weight:600;margin-left:16px}
main{padding:32px 0 48px}
h1{font-family:var(--f-book);font-size:clamp(24px,4vw,32px);margin:0 0 16px;line-height:1.3}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.item{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.item img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.item b{font-size:17px;display:block}.item .d{color:var(--muted);font-size:14px}
.price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
label.f{display:block;font-weight:600;margin-bottom:6px}
input[type=email]{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:inherit}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{font:inherit;font-weight:600;font-size:14px;padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:inherit;cursor:pointer}
.methods button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}.agree input{margin-top:5px;width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--line);color:inherit;background:var(--card);cursor:pointer}
.btn.buy{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp);width:100%;font-size:17px;padding:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.test{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:10px 0 0;min-height:1em}
.done .mark{width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin-bottom:12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}dt{color:var(--muted)}dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-all}
ol.steps{padding-left:20px;margin:8px 0 0}ol.steps li{margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
footer{border-top:1px solid var(--line);padding:24px 0 60px;font-size:13px;color:var(--muted)}footer a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:420px){.item{grid-template-columns:88px 1fr}.methods{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="in"><a class="logo" href="/">하루<b>한권</b></a><nav><a href="/">전자책</a><a href="/exams">합격플랜</a></nav></div></header>
<main class="in" id="app"><p>불러오는 중…</p></main>
<footer><div class="in">
  <div><b>하루한권</b><br>상호 하루한권 · 대표 황대식<br>사업자등록번호 693-63-00898 <a href="https://www.ftc.go.kr/bizCommPop.do?wrkr_no=6936300898" target="_blank" rel="noopener">사업자정보확인</a><br>통신판매업신고 진행 중<br><!--BIZ_ADDR-->주소 등록 중<!--/BIZ_ADDR--><br>고객센터 <!--BIZ_CS-->준비 중<!--/BIZ_CS--></div>
  <div style="margin-top:8px"><a href="/terms">이용약관</a> · <a href="/privacy"><b>개인정보처리방침</b></a> · <a href="/terms#refund">환불정책</a> · 결제대행 토스페이먼츠</div>
</div></footer>
<script>
const $=s=>document.querySelector(s), app=$("#app"), q=new URLSearchParams(location.search);
const won=n=>Number(n).toLocaleString("ko-KR")+"원";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rand=n=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789",b=crypto.getRandomValues(new Uint8Array(n));return [...b].map(x=>a[x%a.length]).join("")};
const idOf=orderId=>(/^HR_([a-z0-9-]+)_/.exec(orderId||"")||[])[1];
async function getExams(){const r=await fetch("/exam/data.json");return r.json()}
const fail=(title,msg,id)=>{app.innerHTML=`<h1>${esc(title)}</h1><div class="box"><p style="margin:0">${esc(msg)}</p></div><div class="acts">${id?`<a class="btn" href="/pay?item=${esc(id)}">다시 결제하기</a>`:""}<a class="btn" href="/exams">합격플랜 목록</a></div>`};

async function order(){
  const id=q.get("item"), x=(await getExams()).find(e=>e.id===id);
  if(!x) return fail("상품을 찾을 수 없어요","목록에서 다시 골라 주세요.");
  document.title=`${x.name} 결제 · 하루한권`;
  let cfg; try{cfg=await (await fetch("/api/pay/config")).json()}catch(e){}
  if(!cfg||!window.TossPayments) return fail("결제 화면을 불러오지 못했어요","잠시 뒤 새로고침해 주세요.",id);
  let method="CARD";
  app.innerHTML=`<h1>결제하기</h1>
  ${cfg.test?`<div class="test">테스트 결제 모드예요. 실제로 돈이 나가지 않아요.</div>`:""}
  <div class="box item"><img src="/exam/img/${esc(x.id)}-0.webp" alt="" width="1304" height="976"><div><b>${esc(x.name)} 합격플랜</b><span class="d">${esc(x.desc)}</span><div class="price">${won(x.krw)}</div></div></div>
  <form class="box" id="f" novalidate>
    <label class="f" for="email">이메일</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
    <p class="hint">결제 영수증을 이 주소로 보내요. 파일은 결제 후 이 화면에서 바로 받아요.</p>
    <p class="f" style="font-weight:600;margin:18px 0 6px">결제 수단</p>
    <div class="methods" role="group" aria-label="결제 수단">
      <button type="button" data-m="CARD" aria-pressed="true">카드·간편결제</button>
      <button type="button" data-m="TRANSFER" aria-pressed="false">계좌이체</button>
      <button type="button" data-m="MOBILE_PHONE" aria-pressed="false">휴대폰</button>
    </div>
    <p class="hint">카드 결제창에서 토스페이·카카오페이·네이버페이 같은 간편결제도 고를 수 있어요.</p>
    <label class="agree" style="margin-top:18px"><input type="checkbox" id="agree"><span>디지털 파일이라 <b>한 번 내려받으면 환불(청약철회)이 제한</b>된다는 점과 <a href="/terms" target="_blank">이용약관</a>·<a href="/privacy" target="_blank">개인정보처리방침</a>을 확인했어요. 내려받기 전에는 7일 안에 전액 환불돼요.</span></label>
    <button class="btn buy" type="submit" style="margin-top:18px">${won(x.krw)} 결제하기</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="hint">먼저 풀어 보고 싶다면 <a href="/trial/${esc(x.id)}.html" target="_blank">무료 체험판</a>을 열어 보세요.</p>`;
  const saved=store.get("pay-email"); if(saved) $("#email").value=saved;
  $(".methods").onclick=e=>{const b=e.target.closest("button");if(!b)return;method=b.dataset.m;document.querySelectorAll(".methods button").forEach(o=>o.setAttribute("aria-pressed",o===b))};
  const payment=TossPayments(cfg.clientKey).payment({customerKey:TossPayments.ANONYMOUS});
  $("#f").onsubmit=async e=>{
    e.preventDefault();const err=$("#err"),email=$("#email").value.trim();err.textContent="";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent="이메일 주소를 확인해 주세요.";$("#email").focus();return}
    if(!$("#agree").checked){err.textContent="안내 내용에 동의해 주세요.";return}
    store.set("pay-email",email);
    const opt={method,amount:{currency:"KRW",value:x.krw},orderId:`HR_${x.id}_${rand(14)}`,orderName:`${x.name} 합격플랜`.slice(0,100),
      successUrl:location.origin+"/pay?done=1",failUrl:location.origin+`/pay?fail=1&item=${encodeURIComponent(x.id)}`,customerEmail:email};
    if(method==="CARD") opt.card={useEscrow:false,flowMode:"DEFAULT",useCardPoint:false,useAppCardOnly:false};
    if(method==="TRANSFER") opt.transfer={cashReceipt:{type:"소득공제"},useEscrow:false};
    try{await payment.requestPayment(opt)}catch(ex){if(ex&&ex.code!=="USER_CANCEL")err.textContent=ex.message||"결제창을 열지 못했어요."}
  };
}

function showDone(r){
  const list=(store.get("pay-orders")||[]).filter(o=>o.orderId!==r.orderId);
  list.unshift({orderId:r.orderId,name:r.name,id:r.id,download:r.download,until:Date.now()+r.days*864e5});
  store.set("pay-orders",list.slice(0,20));
  app.innerHTML=`<div class="done"><div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>결제가 끝났어요</h1>
  ${r.test?`<div class="test">테스트 결제예요. 실제로 돈이 나가지 않았어요.</div>`:""}
  <div class="box"><a class="btn buy" href="${esc(r.download)}">${esc(r.name)} 파일 받기</a>
  <ol class="steps"><li>받은 zip 파일을 열어 <b>압축을 풀어요</b>.</li><li>안에 있는 <b>00_먼저읽기.txt</b>를 보고 html 파일을 크롬이나 엣지로 열어요.</li><li>이 화면 주소를 저장해 두면 <b>${r.days}일 동안</b> 다시 받을 수 있어요.</li></ol>
  <p class="hint"><a href="/exam/${esc(r.id)}#open">파일 여는 방법 자세히 보기</a></p></div>
  <div class="box"><dl><dt>상품</dt><dd>${esc(r.name)} 합격플랜</dd><dt>결제 금액</dt><dd>${won(r.amount)}</dd><dt>결제 수단</dt><dd>${esc(r.method||"")}</dd><dt>주문번호</dt><dd>${esc(r.orderId)}</dd></dl>
  ${r.receipt?`<div class="acts"><a class="btn" href="${esc(r.receipt)}" target="_blank" rel="noopener">영수증 보기</a></div>`:""}</div>
  <p class="hint">환불·문의는 주문번호와 함께 고객센터로 알려 주세요. 내려받기 전이면 7일 안에 전액 환불돼요.</p></div>`;
  history.replaceState(null,"",`/pay?order=${encodeURIComponent(r.orderId)}`);
}

async function done(){
  const paymentKey=q.get("paymentKey"),orderId=q.get("orderId"),amount=q.get("amount");
  app.innerHTML=`<h1>결제를 확인하고 있어요</h1><p>창을 닫지 말고 잠시만 기다려 주세요.</p>`;
  let r; try{const res=await fetch("/api/pay/confirm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({paymentKey,orderId,amount})});r=await res.json();if(!res.ok)throw r}
  catch(ex){return fail("결제가 승인되지 않았어요",(ex&&ex.message)||"잠시 뒤 다시 시도해 주세요. 돈이 빠져나갔다면 고객센터로 알려 주세요.",idOf(orderId))}
  showDone(r);
}

function reopen(){
  const o=(store.get("pay-orders")||[]).find(o=>o.orderId===q.get("order"));
  if(!o||o.until<Date.now()) return fail("내려받기 정보가 없어요","이 기기에서 결제한 주문만 다시 열 수 있어요. 고객센터로 주문번호를 알려 주시면 다시 보내 드려요.");
  app.innerHTML=`<h1>${esc(o.name)} 파일</h1><div class="box"><a class="btn buy" href="${esc(o.download)}">파일 다시 받기</a><p class="hint">${new Date(o.until).toLocaleDateString("ko-KR")}까지 받을 수 있어요. 주문번호 ${esc(o.orderId)}</p></div>`;
}

if(q.get("done")) done();
else if(q.get("fail")) fail(q.get("code")==="PAY_PROCESS_CANCELED"?"결제를 취소했어요":"결제가 되지 않았어요",q.get("message")||"다시 시도해 주세요.",q.get("item"));
else if(q.get("order")) reopen();
else order();
</script>
</body>
</html>

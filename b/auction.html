<style>
/* Layout: a bookshop counter — the cover held still on the left with the price, the reading pitch scrolling on the right */
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#16202A; --muted:#56616C; --line:#DFE3E8;
  --accent:#2446C7; --accent-ink:#FFFFFF; --accent-soft:#E6EBFB; --sale:#B3301B; --paper:#FBF8F1; --paper-ink:#2A2620; --sel:#C9D4FA;
  --night:#141C2B; --night-ink:#EEF0F4; --lamp:#F2B84B; --lamp-ink:#1D1606; --lamp-soft:#FBF0D9; --ok:#22784A;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-book:"Gowun Batang","Nanum Myeongjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --card:#182029; --ink:#E8ECF0; --muted:#A3AEB9; --line:#2A3440;
  --accent:#8EA3F7; --accent-ink:#0B1230; --accent-soft:#1E2A4D; --sale:#F28A75; --paper:#1F1D19; --paper-ink:#EDE6D8; --sel:#2F3F73;
  --night:#0A0F18; --night-ink:#EEF0F4; --lamp:#F2B84B; --lamp-ink:#1D1606; --lamp-soft:#2E2715; --ok:#5CC28A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --card:#182029; --ink:#E8ECF0; --muted:#A3AEB9; --line:#2A3440;
  --accent:#8EA3F7; --accent-ink:#0B1230; --accent-soft:#1E2A4D; --sale:#F28A75; --paper:#1F1D19; --paper-ink:#EDE6D8; --sel:#2F3F73;
  --night:#0A0F18; --night-ink:#EEF0F4; --lamp:#F2B84B; --lamp-ink:#1D1606; --lamp-soft:#2E2715; --ok:#5CC28A; color-scheme:dark}
*{box-sizing:border-box}
::selection{background:var(--sel);color:var(--ink)}
html{scrollbar-color:var(--line) var(--bg);scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-underline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{font-family:var(--f-book);font-weight:700;font-size:21px;text-decoration:none}
.logo span{color:var(--lamp)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo span{color:#B57A10}}
:root[data-theme="light"] .logo span{color:#B57A10}
header nav{margin-left:auto;display:flex;gap:18px;font-size:14px;font-weight:600}
header nav a{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border-radius:10px;padding:14px 20px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.btn:hover{border-color:var(--ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* layout */
/* B: Skillshare-style — book header on the left, buy card pinned on the right for the whole scroll */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);grid-template-rows:auto 1fr;column-gap:56px;row-gap:40px;padding-block:40px 80px;align-items:start}
.top{grid-column:1;grid-row:1;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:end}
.top .cover{width:100%}
.metaline{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.metaline li{display:inline-flex;align-items:center;gap:6px}
.metaline li+li::before{content:"";width:3px;height:3px;border-radius:50%;background:currentColor;margin-right:8px;opacity:.6}
.side{grid-column:2;grid-row:1/span 2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:18px}
.main{grid-column:1;grid-row:2}
.buy .head{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.buy .head .cover{width:44px;border-radius:2px 4px 4px 2px;box-shadow:inset 3px 0 0 rgba(0,0,0,.2)}
.buy .head b{font-family:var(--f-book);font-size:16px;line-height:1.4}
.cover{max-width:100%;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:inset 8px 0 0 rgba(0,0,0,.2),0 24px 40px -22px rgba(10,16,30,.55);aspect-ratio:5/8}
.cover svg{display:block;width:100%;height:100%}
.buy{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 40px -28px rgba(10,16,30,.45)}
.buy .btn.primary{border-radius:999px;padding:15px 20px;font-size:17px}
.buy .btn.primary svg{transition:transform .2s cubic-bezier(.16,1,.3,1)}.buy .btn.primary:hover svg{transform:translateX(3px)}
.price .once{display:grid;line-height:1.3;font-size:12px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;color:var(--muted);margin:-4px 0 0;padding:0;list-style:none}
.badges li{display:inline-flex;gap:5px;align-items:center}
.badges svg{color:var(--ok)}
.refund{font-size:12px;color:var(--muted);text-align:center;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price .off{color:var(--sale);font-weight:700;font-size:20px}
.price .now{font-weight:700;font-size:30px;letter-spacing:-.5px}
.price .was{color:var(--muted);text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px;color:var(--muted);margin:0}
.facts dt{float:left;margin-right:6px}.facts dd{margin:0;color:var(--ink);font-weight:600}
.facts div{display:flex;gap:6px}
.setbox{display:grid;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;text-decoration:none;color:var(--ink)}
.setbox:hover{border-color:var(--ink)}
.setbox b{font-size:14px}.setbox s{color:var(--muted)}
.main{min-width:0;display:grid;gap:64px}
.intro{display:grid;gap:12px}
.cat{font-size:14px;font-weight:600;color:var(--accent)}
h1{font-family:var(--f-book);font-size:clamp(28px,4vw,42px);line-height:1.3;margin:0;text-wrap:balance}
.subtitle{font-size:18px;color:var(--muted);margin:0}
.summary{list-style:none;margin:8px 0 0;padding:20px 22px;display:grid;gap:12px;background:var(--accent-soft);border-radius:14px}
.summary li{display:flex;gap:12px;align-items:flex-start}
.summary svg{flex:none;margin-top:5px;color:var(--accent)}
h2{font-family:var(--f-book);font-size:clamp(22px,2.8vw,28px);line-height:1.4;margin:0 0 18px;text-wrap:balance}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;margin-bottom:-40px}
.tabs a{padding:12px 14px;font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink);border-color:var(--ink)}
.pains{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pains li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:16px}
.pains li::before{content:"“";font-family:var(--f-book);font-weight:700;color:var(--accent);margin-right:6px}
.answer{margin:22px 0 0;font-family:var(--f-book);font-size:20px;line-height:1.6}
.who{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.who li{display:flex;gap:10px;align-items:flex-start;padding-block:10px;border-bottom:1px solid var(--line)}
.who svg{flex:none;margin-top:6px;color:var(--accent)}
.toc{counter-reset:ch;display:grid;gap:0;border-top:2px solid var(--ink)}
.ch{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.ch .no{font-family:var(--f-display);font-size:30px;color:var(--accent);line-height:1}
.tocmore{border-top:0;border-bottom:1px solid var(--line)}
.tocmore>summary{padding:14px 0;color:var(--accent);justify-content:flex-start}
.tocmore>summary:hover{background:none}
.tocmore[open]>summary{display:none}
.tocmore p{padding:0}
.ch b{font-size:17px;display:block;margin-bottom:6px}
.ch ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.excerpt{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:40px clamp(20px,5vw,56px);font-family:var(--f-book);font-size:18px;line-height:2;box-shadow:0 1px 0 var(--line),0 18px 30px -24px rgba(0,0,0,.35);position:relative}
.excerpt .from{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:block;margin-bottom:14px}
.excerpt p{margin:0}
.outcomes{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.outcomes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline;font-size:17px}
.outcomes .when{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 10px;white-space:nowrap}
.faqbox{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
details{border-top:1px solid var(--line);padding:0}
details:first-child{border-top:0}
details summary{padding:16px 18px;align-items:center}
details summary:hover{background:var(--bg)}
summary .meta{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
details p{padding:0 18px 16px}
.faq-more{margin:14px 0 0;font-size:14px;color:var(--muted)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:12px}
summary::-webkit-details-marker{display:none}
summary svg{flex:none;margin-left:auto;color:var(--muted);transition:transform .3s cubic-bezier(.16,1,.3,1)}
summary .meta+svg{margin-left:0}
details[open] summary svg{transform:rotate(180deg)}
details p{margin:8px 0 0;color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.files div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.files dt{font-size:13px;color:var(--muted)}.files dd{margin:0;font-weight:700}
.notice{font-size:14px;color:var(--muted);margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.more a{display:grid;gap:8px;text-decoration:none}
.more .cover{transition:transform .25s cubic-bezier(.16,1,.3,1)}
.more a:hover .cover{transform:translateY(-4px)}
.more b{font-size:15px;line-height:1.4}.more span{font-size:14px;color:var(--muted)}
/* files you get (unlocked after payment) */
.getfiles{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.getfiles li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.4;background:var(--bg)}
.getfiles .ext{font-size:11px;font-weight:700;letter-spacing:.5px;border-radius:5px;padding:3px 6px;color:var(--accent-ink);background:var(--accent)}
.getfiles .ext.pdf{background:var(--sale)}
.getfiles small{display:block;color:var(--muted);font-size:12px}
.getfiles svg{color:var(--muted)}
.gethead{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--muted)}
.wish{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.wish:hover{border-color:var(--ink)}
.wish:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wish[aria-pressed="true"]{color:var(--sale);border-color:var(--sale)}
.wish[aria-pressed="true"] svg{fill:currentColor}
/* end-of-preview: the page fades out and the buy card takes over */
.excerpt.cut{padding-bottom:120px;overflow:hidden}
.excerpt.cut::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(to bottom,transparent,var(--paper) 70%);pointer-events:none}
.endcard{position:relative;z-index:1;margin:-72px clamp(12px,4vw,40px) 0;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:48px;padding:12px 12px 12px 14px;box-shadow:0 18px 36px -18px rgba(10,16,30,.45)}
.endcard .cover{width:64px;border-radius:2px 5px 5px 2px;box-shadow:inset 4px 0 0 rgba(0,0,0,.2)}
.endcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.endcard b{display:block;font-size:15px;color:var(--ink);line-height:1.4}
.endcard .btn{padding:12px 18px;border-radius:999px;white-space:nowrap}
.bar .thumb{width:36px;flex:none;border-radius:2px 4px 4px 2px;overflow:hidden;aspect-ratio:5/8;box-shadow:inset 3px 0 0 rgba(0,0,0,.2)}
.bar .thumb svg{display:block;width:100%;height:100%}
@media (max-width:560px){.endcard{grid-template-columns:52px minmax(0,1fr);border-radius:18px}.endcard .cover{width:52px}.endcard .btn{grid-column:1/-1}}
.reviews{display:grid;justify-items:center;text-align:center;gap:14px;padding:36px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--card)}
.papers{position:relative;width:150px;height:96px}
.papers i{position:absolute;bottom:0;left:50%;width:64px;height:84px;margin-left:-32px;border-radius:8px;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 14px -8px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.16,1,.3,1)}
.papers i::before{content:"";position:absolute;inset:14px 10px auto;height:30px;background:repeating-linear-gradient(to bottom,var(--line) 0 3px,transparent 3px 9px)}
.papers i:nth-child(1){transform:translateX(-34px) rotate(-8deg)}
.papers i:nth-child(3){transform:translateX(34px) rotate(8deg)}
.papers i:nth-child(2){z-index:1;background:var(--lamp-soft)}

.reviews:hover .papers i:nth-child(3){transform:translate(46px,-6px) rotate(12deg)}
.reviews:hover .papers i:nth-child(2){transform:translateY(-8px)}
.reviews b{font-family:var(--f-book);font-size:20px}
.reviews p{margin:0;color:var(--muted);font-size:15px;max-width:36ch}
.bar{display:none}
footer{border-top:1px solid var(--line);background:var(--card);font-size:12px;color:var(--muted)}
footer .wrap{padding-block:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}

  .bar .wish{padding:0;width:46px;height:46px;border-radius:14px}
  .bar.show{transform:none}
}
@media (max-width:420px){.bar .thumb{display:none}.facts{gap:4px 10px}.ch{grid-template-columns:48px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="/ko.css">
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/">하루<span>한권</span></a>
  <nav><a href="/store">전체 책</a><a href="#faq">자주 묻는 질문</a></nav>
</div></header>
<div class="wrap"><div class="layout" id="app"></div></div>
<div class="bar" id="bar"></div>
<footer><div class="wrap">
  <div><b>하루한권</b><br>상호 하루한권 · 대표 황대식<br>사업자등록번호 693-63-00898 <a href="https://www.ftc.go.kr/bizCommPop.do?wrkr_no=6936300898" target="_blank" rel="noopener">사업자정보확인</a><br>통신판매업신고 진행 중<br><!--BIZ_ADDR-->주소 등록 중<!--/BIZ_ADDR--><br>고객센터 <!--BIZ_CS-->준비 중<!--/BIZ_CS--></div>
  <div><b>환불 안내</b><br>내려받기 전이면 7일 안에 전액 환불됩니다. 내려받은 뒤에는 전자상거래법 제17조 제2항에 따라 청약철회가 제한됩니다. 파일에 문제가 있으면 교환 또는 환불해 드립니다.</div>
  <div style="grid-column:1/-1">© 2026 하루한권 · <a href="/terms">이용약관</a> · <a href="/privacy"><b>개인정보처리방침</b></a> · <a href="/terms#refund">환불정책</a></div>
</div></footer>

<script>window.BOOK_ID="auction"</script>
<script src="/books.js"></script>
<script>
const CHECK='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>';
const CHEV='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
const COMMON_FAQ=[
  ["환불되나요?","내려받기 전이면 결제일부터 7일 안에 전액 환불됩니다. 내려받은 뒤에는 전자상거래법 제17조 제2항에 따라 청약철회가 제한되지만, 파일이 열리지 않거나 내용이 빠져 있으면 교환 또는 환불해 드립니다.","환불"],
  ["어떤 파일로 받나요?","EPUB과 PDF를 함께 드립니다. 휴대폰·태블릿·전자책 리더기는 EPUB, 컴퓨터나 인쇄는 PDF가 편합니다.","파일 형식"],
  ["어떤 기기에서 읽을 수 있나요?","아이폰(도서 앱), 안드로이드(구글 플레이 북·리디 등 EPUB 앱), 태블릿, 크레마·킨들 같은 전자책 리더기, PC·맥 모두 됩니다. 앱이 없으면 PDF를 그냥 열어도 됩니다.","기기"],
  ["결제하면 언제 받나요?","결제가 끝나면 결제 완료 화면에서 바로 PDF·EPUB을 내려받을 수 있습니다.","즉시"],
  ["파일을 잃어버리면 어떻게 하나요?","구매내역(haruhangwon.kr/orders)에서 주문번호를 넣으면 언제든 다시 받을 수 있습니다. 주문번호는 결제 확인 메일에도 있어요.","재다운로드"]
];
const ARROW='<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const LOCK='<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>';
const WHEN=["오늘","이번 주","한 달 뒤"];
const STORE=location.protocol.startsWith("http")&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")?"/store":"#";
function priceHtml(b){return `<div class="price">${b.was?`<span class="off">${off(b)}%</span>`:""}<span class="now">${won(b.price)}</span><span class="once">${b.was?`<s>${won(b.was)}</s>`:""}<span>한 번 결제 · 평생 소장</span></span></div>`}
const chHtml=(c,i)=>`<div class="ch"><div class="no">${String(i+1).padStart(2,"0")}</div><div><b>${c[0]}</b><ul>${c.slice(1).map(t=>`<li>${t}</li>`).join("")}</ul></div></div>`;
function render(){
  const id=(location.hash||"").slice(1)||window.BOOK_ID||"";
  const b=BOOKS.find(x=>x.id===id)||BOOKS[0];
  document.title=b.title+" | 하루한권";
  const buyHref=STORE==="#"?"#"+b.id:"/store#buy-"+b.id;
  app.innerHTML=`
  <section class="top">
    <div class="cover">${coverSVG(b)}</div>
    <div class="intro">
      <div class="cat">${b.cat}</div>
      <h1>${b.title}</h1>
      <p class="subtitle">${b.sub}</p>
      <ul class="metaline"><li>${b.chapters}장 · ${b.pages}쪽</li><li>${readTime(b)}이면 다 읽어요</li><li>EPUB · PDF</li><li>결제 즉시 받기</li></ul>
    </div>
  </section>
  <aside class="side">
    <div class="buy" id="buybox">
      <div class="head"><div class="cover">${coverSVG(b)}</div><b>${b.title}</b></div>
      ${priceHtml(b)}
      <dl class="facts"><div><dt>형식</dt><dd>EPUB · PDF</dd></div><div><dt>분량</dt><dd>${b.pages}쪽</dd></div><div><dt>구성</dt><dd>${b.chapters}장</dd></div><div><dt>읽는 시간</dt><dd>${readTime(b)}</dd></div></dl>
      <a class="btn primary" href="${buyHref}">${won(b.price)} 바로 받기 ${ARROW}</a>
      ${(()=>{const g=goalOfBook(b.id);if(!g)return "";const st=setOf(g);return `<a class="setbox" href="${STORE==="#"?"#"+b.id:"/store#set-"+g.k}"><b>3권 세트로 사면 ${won(st.sum-st.price)} 아껴요</b><span>${g.t} 세트 ${won(st.price)} <s>${won(st.sum)}</s> ›</span></a>`})()}
      <ul class="badges"><li>${CHECK}결제 즉시 다운로드</li><li>${CHECK}EPUB · PDF</li><li>${CHECK}7일 환불</li></ul>
      <button class="wish" type="button" data-w aria-pressed="${WISH.has(b.id)}">${HEART}<span>찜하기</span></button>
      <div class="gethead">${LOCK}<span>결제하면 바로 열리는 파일 2개</span></div>
      <ul class="getfiles">
        <li><span class="ext">EPUB</span><span>${b.title}.epub<small>휴대폰 · 태블릿 · 리더기</small></span>${LOCK}</li>
        <li><span class="ext pdf">PDF</span><span>${b.title}.pdf<small>PC · 인쇄 · ${b.pages}쪽</small></span>${LOCK}</li>
      </ul>
      <p class="refund">내려받기 전이면 7일 안에 전액 환불해 드려요.</p>
    </div>
  </aside>
  <article class="main">
    <ul class="summary">${b.summary.map(t=>`<li>${CHECK}<span>${t}</span></li>`).join("")}</ul>
    <nav class="tabs" aria-label="상세 목차"><a href="#s-pain">책 소개</a><a href="#s-toc">목차</a><a href="#s-preview">미리보기</a><a href="#s-reviews">후기</a><a href="#faq">자주 묻는 질문</a></nav>
    <section id="s-pain">
      <h2>이런 고민, 해 보셨나요?</h2>
      <ul class="pains">${b.pains.map(t=>`<li>${t}</li>`).join("")}</ul>
      <p class="answer">이 책은 이 고민들을 ${b.chapters}개 장, ${b.pages}쪽 안에서 하나씩 순서대로 풀어 드립니다.</p>
    </section>
    <section>
      <h2>이런 분께 추천합니다</h2>
      <ul class="who">${b.who.map(t=>`<li>${CHECK}<span>${t}</span></li>`).join("")}</ul>
    </section>
    <section id="s-toc">
      <h2>목차</h2>
      <div class="toc">${b.toc.slice(0,4).map(chHtml).join("")}${b.toc.length>4?`<details class="tocmore"><summary><span>나머지 ${b.toc.length-4}개 장 펼쳐 보기</span>${CHEV}</summary>${b.toc.slice(4).map((c,i)=>chHtml(c,i+4)).join("")}</details>`:""}</div>
    </section>
    <section id="s-preview">
      <h2>본문 미리보기</h2>
      <div class="excerpt cut"><span class="from">${b.toc[0][0]} 중에서</span><p>${b.preview}</p></div>
      <div class="endcard"><div class="cover">${coverSVG(b)}</div><p><b>미리보기는 여기까지예요</b>나머지 ${b.chapters-1}개 장과 체크리스트는 책에서 이어집니다.</p><a class="btn primary" href="${buyHref}">${won(b.price)} 바로 받기</a></div>
    </section>
    <section>
      <h2>읽고 나면 이렇게 됩니다</h2>
      <ul class="outcomes">${b.outcomes.map((t,i)=>`<li><span class="when">${WHEN[i]}</span><span>${t}</span></li>`).join("")}</ul>
    </section>
    <section id="s-reviews">
      <h2>독자 후기</h2>
      <div class="reviews"><div class="papers" aria-hidden="true"><i></i><i></i><i></i></div><b>후기 준비 중</b><p>첫 독자분들의 후기가 모이면 여기에 그대로 싣습니다. 지어낸 후기는 올리지 않아요.</p></div>
    </section>
    <section id="faq">
      <h2>자주 묻는 질문</h2>
      <div class="faqbox">${[...COMMON_FAQ.slice(0,3),...b.faq,...COMMON_FAQ.slice(3)].map((q,i)=>`<details${i===0?" open":""}><summary><span>${q[0]}</span>${q[2]?`<span class="meta">${q[2]}</span>`:""}${CHEV}</summary><p>${q[1]}</p></details>`).join("")}</div>
      <p class="faq-more">더 궁금한 점은 아래 고객센터 이메일로 물어봐 주세요.</p>
    </section>
    <section>
      <h2>파일 안내</h2>
      <dl class="files"><div><dt>파일</dt><dd>EPUB, PDF</dd></div><div><dt>분량</dt><dd>${b.pages}쪽 · ${b.chapters}장</dd></div><div><dt>지은이</dt><dd>하루한권 편집부</dd></div></dl>
      ${b.notice?`<p class="notice">${b.notice}</p>`:""}
    </section>
    <section>
      <h2>같은 분야 다른 책</h2>
      <div class="more">${BOOKS.filter(x=>x.id!==b.id).sort((x,y)=>(y.cat===b.cat)-(x.cat===b.cat)).slice(0,3).map(x=>`<a href="${STORE==="#"?"#"+x.id:"/b/"+x.id}"><div class="cover">${coverSVG(x)}</div><b>${x.title}</b><span>${won(x.price)}</span></a>`).join("")}</div>
    </section>
  </article>`;
  bar.innerHTML=`<span class="thumb">${coverSVG(b)}</span><span class="pb"><b>${b.was?`<span>${off(b)}%</span>`:""}${won(b.price)}</b><small>EPUB·PDF 즉시 · 7일 환불</small></span><button class="wish" type="button" data-w aria-pressed="${WISH.has(b.id)}" aria-label="찜하기">${HEART}</button><a class="btn primary" href="${buyHref}">바로 받기</a>`;
  if(window.IntersectionObserver){if(window._io)_io.disconnect();window._io=new IntersectionObserver(([e])=>bar.classList.toggle("show",!e.isIntersecting));_io.observe(document.querySelector("#buybox .btn.primary"))}else bar.classList.add("show");
  document.querySelectorAll("[data-w]").forEach(w=>w.onclick=()=>{const on=WISH.toggle(b.id);document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed",on))});
}
// 페이지 안 이동(목차·FAQ 탭)은 주소의 #책id를 바꾸지 않고 스크롤만 함. 새로고침·공유 때 다른 책이 뜨는 문제 방지.
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute("href").slice(1);if(!id||BOOKS.some(b=>b.id===id))return;const t=document.getElementById(id);if(!t)return;e.preventDefault();t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(BOOKS.some(b=>b.id===id)){render();window.scrollTo(0,0)}});
render();
</script>
</body>
</html>

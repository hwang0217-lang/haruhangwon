<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>디자인 템플릿 판매 부업 첫걸음 | 하루한권</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap">
<style>
/* Layout: a bookshop counter — the cover held still on the left with the price, the reading pitch scrolling on the right */
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#16202A; --muted:#56616C; --line:#DFE3E8;
  --accent:#2446C7; --accent-ink:#FFFFFF; --accent-soft:#E6EBFB; --sale:#B3301B; --paper:#FBF8F1; --paper-ink:#2A2620; --sel:#C9D4FA;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-book:"Gowun Batang","Nanum Myeongjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --card:#182029; --ink:#E8ECF0; --muted:#A3AEB9; --line:#2A3440;
  --accent:#8EA3F7; --accent-ink:#0B1230; --accent-soft:#1E2A4D; --sale:#F28A75; --paper:#1F1D19; --paper-ink:#EDE6D8; --sel:#2F3F73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --card:#182029; --ink:#E8ECF0; --muted:#A3AEB9; --line:#2A3440;
  --accent:#8EA3F7; --accent-ink:#0B1230; --accent-soft:#1E2A4D; --sale:#F28A75; --paper:#1F1D19; --paper-ink:#EDE6D8; --sel:#2F3F73; color-scheme:dark}
*{box-sizing:border-box}
::selection{background:var(--sel);color:var(--ink)}
html{scrollbar-color:var(--line) var(--bg);scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.75}
a{color:inherit;text-underline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{font-family:var(--f-book);font-weight:700;font-size:21px;text-decoration:none}
.logo span{color:var(--accent)}
header nav{margin-left:auto;display:flex;gap:18px;font-size:14px;font-weight:600}
header nav a{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border-radius:10px;padding:14px 20px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:56px;padding-block:40px 80px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:18px}
.cover{max-width:100%;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:inset 8px 0 0 rgba(0,0,0,.2),0 24px 40px -22px rgba(10,16,30,.55);aspect-ratio:5/8}
.cover svg{display:block;width:100%;height:100%}
.buy{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price .off{color:var(--sale);font-weight:700;font-size:20px}
.price .now{font-weight:700;font-size:26px}
.price .was{color:var(--muted);text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px;color:var(--muted);margin:0}
.facts dt{float:left;margin-right:6px}.facts dd{margin:0;color:var(--ink);font-weight:600}
.facts div{display:flex;gap:6px}
.main{min-width:0;display:grid;gap:64px}
.intro{display:grid;gap:14px}
.cat{font-size:14px;font-weight:600;color:var(--accent)}
h1{font-family:var(--f-book);font-size:clamp(28px,4vw,42px);line-height:1.3;margin:0;text-wrap:balance}
.subtitle{font-size:18px;color:var(--muted);margin:0}
.summary{list-style:none;margin:8px 0 0;padding:20px 22px;display:grid;gap:12px;background:var(--accent-soft);border-radius:14px}
.summary li{display:flex;gap:12px;align-items:flex-start}
.summary svg{flex:none;margin-top:5px;color:var(--accent)}
h2{font-family:var(--f-book);font-size:clamp(22px,2.8vw,28px);line-height:1.4;margin:0 0 18px;text-wrap:balance}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;margin-bottom:-40px}
.tabs a{padding:12px 14px;font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink);border-color:var(--ink)}
.pains{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pains li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:16px}
.pains li::before{content:"“";font-family:var(--f-book);font-weight:700;color:var(--accent);margin-right:6px}
.answer{margin:22px 0 0;font-family:var(--f-book);font-size:20px;line-height:1.6}
.who{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.who li{display:flex;gap:10px;align-items:flex-start;padding-block:10px;border-bottom:1px solid var(--line)}
.who svg{flex:none;margin-top:6px;color:var(--accent)}
.toc{counter-reset:ch;display:grid;gap:0;border-top:2px solid var(--ink)}
.ch{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.ch .no{font-family:var(--f-display);font-size:30px;color:var(--accent);line-height:1}
.ch b{font-size:17px;display:block;margin-bottom:6px}
.ch ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.excerpt{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:40px clamp(20px,5vw,56px);font-family:var(--f-book);font-size:18px;line-height:2;box-shadow:0 1px 0 var(--line),0 18px 30px -24px rgba(0,0,0,.35);position:relative}
.excerpt .from{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:block;margin-bottom:14px}
.excerpt p{margin:0}
.outcomes{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.outcomes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline;font-size:17px}
.outcomes .when{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 10px;white-space:nowrap}
details{border-bottom:1px solid var(--line);padding-block:16px}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary svg{flex:none;color:var(--muted);transition:transform .3s cubic-bezier(.16,1,.3,1);margin-top:6px}
details[open] summary svg{transform:rotate(180deg)}
details p{margin:8px 0 0;color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.files div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.files dt{font-size:13px;color:var(--muted)}.files dd{margin:0;font-weight:700}
.notice{font-size:14px;color:var(--muted);margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.more a{display:grid;gap:8px;text-decoration:none}
.more .cover{transition:transform .25s cubic-bezier(.16,1,.3,1)}
.more a:hover .cover{transform:translateY(-4px)}
.more b{font-size:15px;line-height:1.4}.more span{font-size:14px;color:var(--muted)}
.bar{display:none}
footer{border-top:1px solid var(--line);background:var(--card);font-size:12px;color:var(--muted)}
footer .wrap{padding-block:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
footer b{color:var(--ink)}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:24px 120px}
  .side{position:static;grid-template-columns:minmax(0,150px) minmax(0,1fr);align-items:end}
  .buy{padding:14px}.buy .btn{display:none}
  .who,.files{grid-template-columns:minmax(0,1fr)}
  .more{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  header nav{display:none}
  .tabs{margin-bottom:-24px}
  .main{gap:48px}
  .bar{display:flex;gap:12px;align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .bar .btn{flex:1}
  .bar .price .now{font-size:20px}
}
@media (max-width:420px){.side{grid-template-columns:minmax(0,120px) minmax(0,1fr)}.facts{grid-template-columns:minmax(0,1fr)}.ch{grid-template-columns:48px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/">하루<span>한권</span></a>
  <nav><a href="/store">전체 책</a><a href="#faq">자주 묻는 질문</a></nav>
</div></header>
<div class="wrap"><div class="layout" id="app"></div></div>
<div class="bar" id="bar"></div>
<footer><div class="wrap">
  <div><b>하루한권</b><br>상호 하루한권 · 대표 (이름)<br>사업자등록번호 000-00-00000 · 통신판매업신고 제0000-서울○○-0000호<br>고객센터 (이메일 주소)</div>
  <div><b>환불 안내</b><br>내려받기 전이면 7일 안에 전액 환불됩니다. 내려받은 뒤에는 전자상거래법 제17조 제2항에 따라 청약철회가 제한됩니다. 파일에 문제가 있으면 교환 또는 환불해 드립니다.</div>
</div></footer>

<script>window.BOOK_ID="template"</script>
<script src="/books.js"></script>
<script>
const CHECK='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>';
const CHEV='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
const COMMON_FAQ=[
  ["어떤 파일로 받나요?","EPUB과 PDF를 함께 드립니다. 휴대폰·태블릿·전자책 리더기는 EPUB, 컴퓨터나 인쇄는 PDF가 편합니다."],
  ["결제하면 언제 받나요?","결제가 끝나면 바로 결제 완료 화면과 이메일에서 내려받을 수 있습니다."],
  ["파일을 잃어버리면 어떻게 하나요?","구매할 때 적은 이메일의 링크에서 언제든 다시 받을 수 있습니다."]
];
const WHEN=["오늘","이번 주","한 달 뒤"];
const STORE=location.protocol.startsWith("http")&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")?"/store":"#";
function priceHtml(b){return `<div class="price">${b.was?`<span class="off">${off(b)}%</span>`:""}<span class="now">${won(b.price)}</span>${b.was?`<span class="was">${won(b.was)}</span>`:""}</div>`}
function render(){
  const id=(location.hash||"").slice(1)||window.BOOK_ID||"";
  const b=BOOKS.find(x=>x.id===id)||BOOKS[0];
  document.title=b.title+" | 하루한권";
  const buyHref=STORE==="#"?"#"+b.id:"/store#buy-"+b.id;
  app.innerHTML=`
  <aside class="side">
    <div class="cover">${coverSVG(b)}</div>
    <div class="buy">
      ${priceHtml(b)}
      <dl class="facts"><div><dt>형식</dt><dd>EPUB · PDF</dd></div><div><dt>분량</dt><dd>${b.pages}쪽</dd></div><div><dt>구성</dt><dd>${b.chapters}장</dd></div><div><dt>받는 시간</dt><dd>결제 즉시</dd></div></dl>
      <a class="btn primary" href="${buyHref}">바로 구매하기</a>
    </div>
  </aside>
  <article class="main">
    <section class="intro">
      <div class="cat">${b.cat}</div>
      <h1>${b.title}</h1>
      <p class="subtitle">${b.sub}</p>
      <ul class="summary">${b.summary.map(t=>`<li>${CHECK}<span>${t}</span></li>`).join("")}</ul>
    </section>
    <nav class="tabs" aria-label="상세 목차"><a href="#s-pain">책 소개</a><a href="#s-toc">목차</a><a href="#s-preview">미리보기</a><a href="#faq">자주 묻는 질문</a></nav>
    <section id="s-pain">
      <h2>이런 고민, 해 보셨나요?</h2>
      <ul class="pains">${b.pains.map(t=>`<li>${t}</li>`).join("")}</ul>
      <p class="answer">이 책은 이 고민들을 ${b.chapters}개 장, ${b.pages}쪽 안에서 하나씩 순서대로 풀어 드립니다.</p>
    </section>
    <section>
      <h2>이런 분께 추천합니다</h2>
      <ul class="who">${b.who.map(t=>`<li>${CHECK}<span>${t}</span></li>`).join("")}</ul>
    </section>
    <section id="s-toc">
      <h2>목차</h2>
      <div class="toc">${b.toc.map((c,i)=>`<div class="ch"><div class="no">${String(i+1).padStart(2,"0")}</div><div><b>${c[0]}</b><ul>${c.slice(1).map(t=>`<li>${t}</li>`).join("")}</ul></div></div>`).join("")}</div>
    </section>
    <section id="s-preview">
      <h2>본문 미리보기</h2>
      <div class="excerpt"><span class="from">${b.toc[0][0]} 중에서</span><p>${b.preview}</p></div>
    </section>
    <section>
      <h2>읽고 나면 이렇게 됩니다</h2>
      <ul class="outcomes">${b.outcomes.map((t,i)=>`<li><span class="when">${WHEN[i]}</span><span>${t}</span></li>`).join("")}</ul>
    </section>
    <section id="faq">
      <h2>자주 묻는 질문</h2>
      ${[...b.faq,...COMMON_FAQ].map((q,i)=>`<details${i===0?" open":""}><summary>${q[0]}${CHEV}</summary><p>${q[1]}</p></details>`).join("")}
    </section>
    <section>
      <h2>파일 안내</h2>
      <dl class="files"><div><dt>파일</dt><dd>EPUB, PDF</dd></div><div><dt>분량</dt><dd>${b.pages}쪽 · ${b.chapters}장</dd></div><div><dt>지은이</dt><dd>하루한권 편집부</dd></div></dl>
      ${b.notice?`<p class="notice">${b.notice}</p>`:""}
    </section>
    <section>
      <h2>함께 많이 보는 책</h2>
      <div class="more">${BOOKS.filter(x=>x.id!==b.id).sort((x,y)=>(y.cat===b.cat)-(x.cat===b.cat)).slice(0,3).map(x=>`<a href="${STORE==="#"?"#"+x.id:"/b/"+x.id}"><div class="cover">${coverSVG(x)}</div><b>${x.title}</b><span>${won(x.price)}</span></a>`).join("")}</div>
    </section>
  </article>`;
  bar.innerHTML=`${priceHtml(b)}<a class="btn primary" href="${buyHref}">바로 구매하기</a>`;
}
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(BOOKS.some(b=>b.id===id)){render();window.scrollTo(0,0)}});
render();
</script>
</body>
</html>

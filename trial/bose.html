<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보세사 합격플랜 (무료 체험판)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
 --bg:#F2F4F3;--surface:#FFFFFF;--sunk:#F7F8F7;--ink:#172026;--muted:#5A666C;--line:#D8DEDB;--accent:#1D5C4D;--accent-ink:#FFFFFF;--pencil:#E3B126;--pencil-ink:#3B2E05;--hl:#FFE27A;
 --good:#1E7B4E;--mid:#B57A12;--bad:#C2402F;--good-bg:#E3F2EA;--bad-bg:#FBE9E6;--mid-bg:#FBF1DC;--gichul:#6B4FA0;--gichul-bg:#EFEAF8;
 --f-display:'Space Grotesk','Noto Sans KR',system-ui,sans-serif;--f-body:'Inter','Noto Sans KR',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
 --r:10px;--fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101416;--surface:#192024;--sunk:#141A1D;--ink:#E5EBE8;--muted:#9AA7A4;--line:#2B3539;--accent:#5CC0A2;--accent-ink:#0C1A16;--pencil:#E8BE48;--pencil-ink:#2A2003;--hl:rgba(232,190,72,.38);--good:#5CC795;--mid:#E2AE4A;--bad:#F07A68;--good-bg:#173027;--bad-bg:#3A1E1A;--mid-bg:#352A14;--gichul:#B9A2E8;--gichul-bg:#2A2340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101416;--surface:#192024;--sunk:#141A1D;--ink:#E5EBE8;--muted:#9AA7A4;--line:#2B3539;--accent:#5CC0A2;--accent-ink:#0C1A16;--pencil:#E8BE48;--pencil-ink:#2A2003;--hl:rgba(232,190,72,.38);--good:#5CC795;--mid:#E2AE4A;--bad:#F07A68;--good-bg:#173027;--bad-bg:#3A1E1A;--mid-bg:#352A14;--gichul:#B9A2E8;--gichul-bg:#2A2340;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.25}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.12}
h2{font-size:1.2rem}h3{font-size:1.05rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.85rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
/* top nav */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:6px;min-height:52px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;margin-right:auto;text-decoration:none;color:var(--ink);font-size:1rem;padding:6px 0}
.nav a{display:inline-block;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem}
.nav a.on{background:var(--ink);color:var(--surface)}
body.in-exam .top .nav{display:none}
.hero{background:var(--surface);border-bottom:1px solid var(--line);padding-block:28px 24px}
.hero .lead{max-width:64ch;color:var(--muted);margin:10px 0 0}
main.wrap{padding-block:22px 72px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel>h2{margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:5px solid var(--sc,var(--accent))}
.card:hover{border-color:var(--sc,var(--accent))}
.card h3{margin-bottom:4px}
.btn,.primary,.ghost{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:10px 18px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.95rem}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.next{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:2px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:18px 20px}
.next .what{flex:1 1 260px}.next .what b{font-size:1.15rem;display:block;font-family:var(--f-display)}
.stat{display:flex;gap:22px;flex-wrap:wrap}.stat div{min-width:90px}.stat b{display:block;font-size:1.6rem;font-family:var(--f-display)}
.bar{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.bar:last-child{border-bottom:0}
.track{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--good)}.fill.mid{background:var(--mid)}.fill.bad{background:var(--bad)}
.num{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.tag.good{background:var(--good-bg);color:var(--good);border-color:transparent}.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.tag.mid{background:var(--mid-bg);color:var(--mid);border-color:transparent}
.lv{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;margin-left:6px;border:1px solid var(--line);color:var(--muted)}.lv0{color:var(--good);border-color:var(--good)}.lv1{color:var(--mid);border-color:var(--mid)}.lv2{color:var(--bad);border-color:var(--bad)}
.gichul{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:4px;background:var(--gichul-bg);color:var(--gichul);vertical-align:middle;margin-left:6px}
/* tests list */
.tests{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tcard{display:flex;flex-direction:column;gap:2px;text-align:left;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.tcard .tn{font-weight:700;font-family:var(--f-display);font-size:1.05rem}
.tcard.pass{border-color:var(--good);background:var(--good-bg)}.tcard.fail{border-color:var(--bad);background:var(--bad-bg)}
/* exam */
.exhead{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.exhead .wrap{display:flex;align-items:center;gap:12px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.exhead .t{font-weight:700;margin-right:auto}
.timer{font-family:var(--f-mono);font-weight:600;padding:4px 10px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.85rem;color:var(--muted)}
.qmeta .qn{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.passage{background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;margin-bottom:14px;white-space:pre-line}
.au{margin:0 0 14px}.fig{margin:6px 0 14px;text-align:center}.fig svg:not([width]){width:100%;max-width:640px;height:auto}.fig svg{max-width:100%}
.fig figcaption{font-size:.8rem;color:var(--muted)}
.qtext{font-size:1.12rem;font-weight:600;margin:0 0 4px}
.qko{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .bub{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:700}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opt.sel .bub{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.exnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qgrid button{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-size:.85rem}
.qgrid button.done{background:var(--sunk);font-weight:700}
.qgrid button.cur{outline:2px solid var(--accent)}
.qgrid button.flag{border-color:var(--pencil);box-shadow:inset 0 -4px 0 var(--pencil)}
.qgrid button.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}.qgrid button.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.expl{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-size:.95rem}
.expl b{font-family:var(--f-display)}
/* result */
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.verdict{font-weight:700;padding:6px 14px;border-radius:999px}
.verdict.pass{background:var(--good-bg);color:var(--good)}.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.tips{padding-left:20px;margin:0}.tips li{margin:8px 0}
.rv{border-top:1px solid var(--line);padding:16px 0}
.rv:first-child{border-top:0}
/* book */
.chlist{list-style:none;padding:0;margin:0}
.chlist li a{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.chlist .no{font-family:var(--f-mono);color:var(--muted);width:2.4em;flex:none}
.chlist .nm{flex:1}.chlist .nm small{display:block;color:var(--muted)}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.goal{background:var(--mid-bg);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.goal b{display:block;font-size:.8rem;color:var(--mid);margin-bottom:2px}
.terms{width:100%;border-collapse:collapse;font-size:.95rem}
.terms td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.terms td:first-child{font-weight:600;width:42%}
.sec h3{margin:18px 0 6px}
.sec p{margin:6px 0}
.sec ul,.sec ol{margin:6px 0;padding-left:22px}
.sec table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.93rem}
.sec th,.sec td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.sec th{background:var(--sunk)}
.en{font-weight:600}
.ko{color:var(--muted)}
.callout{border-left:4px solid var(--accent);background:var(--sunk);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.terms td:first-child b,.terms td:first-child>span,.sec li b,.sec p b,mark.hl{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;padding:0 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.trap{border-left:4px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0}
.mini{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.crumb{font-size:.88rem;margin-bottom:10px}.crumb a{text-decoration:none}
.chnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:.88rem}
.seg button.on{background:var(--ink);color:var(--surface)}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:620px){.fig{overflow-x:auto}.fig svg:not([width]){min-width:520px}.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;grid-row:2}.qcard{padding:16px}.score .big{font-size:2.4rem}}
@media print{.top,.exhead,.actions,.exnav{display:none}}
</style>
</head>

<script>
const D={"id":"bose-v1","title":"보세사 합격플랜","short":"보세사 합격플랜","eyebrow":"보세사 · 5과목 125문항 135분","lead":"수출입통관·보세구역·화물관리·수출입안전·관세벌칙을 그림표로 정리한 교재와 과목별 모의고사 10회(1,250문항, 회차끼리 겹치지 않음). 채점하면 과락 위험 과목과 약한 단원을 알려 드려요.","about":"<p>보세사 시험은 5과목, 과목당 25문항이에요. <b>매 과목 40점 이상, 평균 60점 이상<\/b>이면 합격이에요.<\/p><p class=\"small muted\">공개 기출은 상업적 이용 허락이 확인되지 않아 원문을 싣지 않았어요. 모든 문항은 관세법령에 맞춰 새로 만든 것이에요. 법령·고시는 2026년 11월 기준이니 개정 여부를 확인하세요.<\/p>","foot":"이 자료는 관세청·한국관세물류협회와 무관한 개인 제작 학습 자료입니다. 구매자 1인 학습용이며 무단 복제·재배포를 금합니다.","subjects":[{"k":"cus","ko":"수출입통관절차","en":"Customs Clearance","color":"#2F5DA8","min":27,"n":25,"topics":{"C_BASIC":["관세법 총칙과 과세 요건","Customs Act Basics","과세 4요건(과세물건·납세의무자·과세표준·세율)과 \"수입신고 하는 때\" 기준을 외우세요.",9],"C_IMP":["수입·수출 신고와 수리","Import & Export Declaration","수입신고 4시기(출항 전·입항 전·도착 전·장치 후)와 \"30일 이내\" 가산세를 외우세요.",8],"C_SPECIAL":["감면·환급과 통관 제한","Exemptions, Refunds & Restrictions","무조건 감면과 조건부 감면, 통관 보류 사유를 구별하세요.",8]},"real":"25문항 27분"},{"k":"zone","ko":"보세구역관리","en":"Bonded Areas","color":"#2F8A5D","min":27,"n":25,"topics":{"Z_TYPE":["보세구역의 종류","Types of Bonded Areas","지정(지정장치장·세관검사장) / 특허(창고·공장·전시장·건설장·판매장) / 종합, 세 갈래로 외우세요.",9],"Z_PAT":["특허와 운영인","Licenses & Operators","특허기간 10년, 결격사유, 특허 효력 상실 사유를 외우세요.",8],"Z_STORE":["장치기간과 보세공장·판매장","Storage Periods, Factories & Duty-free","지정장치장 6개월, 보세창고 1년, 종합보세구역 제한 없음을 표로 외우세요.",8]},"real":"25문항 27분"},{"k":"cargo","ko":"화물관리","en":"Cargo Control","color":"#A8552F","min":27,"n":25,"topics":{"G_INOUT":["반출입과 보수작업","In/Out & Repair Work","반출입은 \"신고\", 보수작업·멸각·폐기·견본품 반출은 \"승인·허가\"로 구별하세요.",9],"G_TRANS":["보세운송과 적재화물목록","Bonded Transport & Manifest","보세운송 기간(해상 10일·항공 5일)과 신고·승인 구별을 외우세요.",8],"G_LONG":["장치기간 경과물품(체화) 처리","Overdue Goods","반출통고 → 매각 공고 → 매각, 순서를 외우세요.",8]},"real":"25문항 27분"},{"k":"aeo","ko":"수출입안전관리","en":"Trade Security","color":"#7A4FA8","min":27,"n":25,"topics":{"A_AEO":["AEO(수출입 안전관리 우수업체)","AEO Program","공인등급 A·AA·AAA, 공인기준 4가지, 유효기간 5년을 외우세요.",9],"A_INTL":["국제 공급망 보안","International Supply Chain Security","WCO SAFE(2005), 미국 C-TPAT, CSI, MRA 뜻을 짝지어 외우세요.",8],"A_PORT":["국제항·운송수단·감시","Ports, Carriers & Surveillance","입항 \"보고\", 출항 \"허가\", 국제항 \"대통령령\"을 외우세요.",8]},"real":"25문항 27분"},{"k":"pen","ko":"자율관리 및 관세벌칙","en":"Self-management & Penalties","color":"#A83F5A","min":27,"n":25,"topics":{"P_SELF":["자율관리보세구역과 보세사","Self-managed Areas & Bonded Officers","보세사 직무(반출입 참관·입회·열쇠 관리)와 징계 3가지(경고·업무정지·등록취소)를 외우세요.",9],"P_CRIME":["관세범의 종류와 벌칙","Customs Crimes & Penalties","금지품 7년, 밀수입 5년, 관세포탈 3년, 가격조작 2년, 숫자 줄을 외우세요.",8],"P_PROC":["조사와 처분(통고처분)","Investigation & Disposition","통고처분 → 이행하면 공소 못 함(일사부재리), 미이행 → 고발 흐름을 외우세요.",8]},"real":"25문항 27분"}],"pass":{"mode":"pct","cut":60,"note":"과목별 40점 이상, 평균 60점"},"book":{"cus":[{"id":"INTRO","ko":"시험 안내와 공부 순서","en":"About the Exam","goal":"보세사 시험 구성과 합격 기준을 알고 공부 순서를 정한다.","terms":[],"secs":[["시험 구성","<table><tr><th>과목<\/th><th>문항<\/th><\/tr><tr><td>수출입통관절차<\/td><td>25<\/td><\/tr><tr><td>보세구역관리<\/td><td>25<\/td><\/tr><tr><td>화물관리<\/td><td>25<\/td><\/tr><tr><td>수출입안전관리<\/td><td>25<\/td><\/tr><tr><td>자율관리 및 관세벌칙<\/td><td>25<\/td><\/tr><\/table><p>5과목 125문항, 135분이에요. <b>매 과목 40점 이상, 평균 60점 이상<\/b>이면 합격이에요.<\/p>"],["공부 순서","<ol><li>1회로 진단<\/li><li>그림 표(보세구역 세 갈래·신고/승인/허가·벌칙 숫자)부터 외우기<\/li><li>틀린 보기 바로잡기 표 반복<\/li><li>9~10회는 135분 시간 재기<\/li><\/ol><p class=\"small muted\">관세법령과 고시는 자주 바뀌어요. 시험 공고일 기준 법령을 꼭 확인하세요.<\/p>"]],"traps":[],"quiz":[]},{"id":"C_BASIC","ko":"관세법 총칙과 과세 요건","en":"Customs Act Basics","goal":"과세 4요건(과세물건·납세의무자·과세표준·세율)과 \"수입신고 하는 때\" 기준을 외우세요.","terms":[],"secs":[["꼭 알아야 할 내용","<ul><li>관세법의 목적은 관세의 부과·징수와 수출입물품 통관을 적정하게 하여 관세수입을 확보하는 것이다.<\/li><li>관세의 과세물건은 수입물품이다.<\/li><li>관세는 수입신고를 하는 때의 물품 성질과 수량에 따라 부과한다.<\/li><li>관세를 부과할 때는 원칙적으로 수입신고 당시의 법령을 적용한다.<\/li><li>수입물품의 관세 납세의무자는 원칙적으로 그 물품을 수입한 화주이다.<\/li><li>관세의 과세표준은 수입물품의 가격 또는 수량이다.<\/li><li>우리나라 관세 과세가격은 CIF(운임·보험료 포함) 기준이다.<\/li><li>과세가격은 원칙적으로 실제로 지급했거나 지급할 가격에 가산요소를 더해 정한다.<\/li><li>관세는 국세이며 간접세에 해당한다.<\/li><li>관세 징수권은 5억원 이상이면 10년, 그 밖에는 5년간 행사하지 않으면 소멸시효가 완성된다.<\/li><li>관세 환급청구권의 소멸시효는 5년이다.<\/li><li>신고납부한 관세는 수입신고 수리일부터 15일 이내에 납부해야 한다.<\/li><li>세관장은 관세의 부과·징수 업무를 맡는다.<\/li><li>외국물품에는 외국에서 들어와 수입신고가 수리되기 전의 물품이 포함된다.<\/li><li>수입신고가 수리된 물품은 내국물품이다.<\/li><li>우리나라 선박이 공해에서 채집한 수산물은 내국물품으로 본다.<\/li><\/ul>"],["헷갈리는 내용 바로잡기","<table><tr><th>틀린 말<\/th><th>바른 내용<\/th><\/tr><tr><td class=\"x\">관세는 물품이 우리나라에 도착한 때의 성질과 수량에 따라 부과한다.<\/td><td><mark class=\"hl\">수입신고를 하는 때의 성질과 수량이 기준이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">수입물품의 납세의무자는 원칙적으로 운송인이다.<\/td><td><mark class=\"hl\">원칙은 그 물품을 수입한 화주예요.<\/mark><\/td><\/tr><tr><td class=\"x\">우리나라 과세가격은 FOB 기준이다.<\/td><td><mark class=\"hl\">CIF 기준(운임·보험료 포함)이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">관세는 지방세이며 직접세이다.<\/td><td><mark class=\"hl\">국세이고 간접세예요.<\/mark><\/td><\/tr><tr><td class=\"x\">관세 징수권의 소멸시효는 금액과 관계없이 3년이다.<\/td><td><mark class=\"hl\">5억원 이상 10년, 그 밖 5년이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">신고납부한 관세는 수입신고 수리일부터 30일 이내에 내면 된다.<\/td><td><mark class=\"hl\">15일 이내예요.<\/mark><\/td><\/tr><tr><td class=\"x\">수입신고가 수리된 물품도 반출 전까지는 외국물품이다.<\/td><td><mark class=\"hl\">수리되면 내국물품이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">관세의 과세물건은 수출물품이다.<\/td><td><mark class=\"hl\">수입물품이에요.<\/mark><\/td><\/tr><\/table>"]],"traps":["관세는 물품이 우리나라에 도착한 때의 성질과 수량에 따라 부과한다. → 수입신고를 하는 때의 성질과 수량이 기준이에요.","수입물품의 납세의무자는 원칙적으로 운송인이다. → 원칙은 그 물품을 수입한 화주예요.","우리나라 과세가격은 FOB 기준이다. → CIF 기준(운임·보험료 포함)이에요."],"nquiz":4,"quiz":[{"q":"관세법 총칙과 과세 요건에 대한 설명으로 옳지 않은 것은?","o":["과세가격은 원칙적으로 실제로 지급했거나 지급할 가격에 가산요소를 더해 정한다.","관세는 물품이 우리나라에 도착한 때의 성질과 수량에 따라 부과한다.","수입물품의 관세 납세의무자는 원칙적으로 그 물품을 수입한 화주이다.","우리나라 관세 과세가격은 CIF(운임·보험료 포함) 기준이다."],"a":1,"e":"옳지 않은 것: \"관세는 물품이 우리나라에 도착한 때의 성질과 수량에 따라 부과한다.\" → 바른 내용: 수입신고를 하는 때의 성질과 수량이 기준이에요."},{"q":"관세법 총칙과 과세 요건에 대한 설명으로 옳지 않은 것은?","o":["관세는 지방세이며 직접세이다.","관세 환급청구권의 소멸시효는 5년이다.","세관장은 관세의 부과·징수 업무를 맡는다.","수입신고가 수리된 물품은 내국물품이다."],"a":0,"e":"옳지 않은 것: \"관세는 지방세이며 직접세이다.\" → 바른 내용: 국세이고 간접세예요."},{"q":"관세법 총칙과 과세 요건에 대한 설명으로 옳은 것은?","o":["우리나라 과세가격은 FOB 기준이다.","관세는 국세이며 간접세에 해당한다.","수입물품의 납세의무자는 원칙적으로 운송인이다.","관세는 지방세이며 직접세이다."],"a":1,"e":"틀린 보기 바로잡기: \"우리나라 과세가격은 FOB 기준이다.\" → CIF 기준(운임·보험료 포함)이에요. / \"관세는 지방세이며 직접세이다.\" → 국세이고 간접세예요. / \"수입물품의 납세의무자는 원칙적으로 운송인이다.\" → 원칙은 그 물품을 수입한 화주예요."},{"q":"관세법 총칙과 과세 요건에 대한 설명으로 옳지 않은 것은?","o":["관세는 수입신고를 하는 때의 물품 성질과 수량에 따라 부과한다.","우리나라 관세 과세가격은 CIF(운임·보험료 포함) 기준이다.","관세는 물품이 우리나라에 도착한 때의 성질과 수량에 따라 부과한다.","수입물품의 관세 납세의무자는 원칙적으로 그 물품을 수입한 화주이다."],"a":2,"e":"옳지 않은 것: \"관세는 물품이 우리나라에 도착한 때의 성질과 수량에 따라 부과한다.\" → 바른 내용: 수입신고를 하는 때의 성질과 수량이 기준이에요."}]},{"id":"C_IMP","ko":"수입·수출 신고와 수리","en":"Import & Export Declaration","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1},{"id":"C_SPECIAL","ko":"감면·환급과 통관 제한","en":"Exemptions, Refunds & Restrictions","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1}],"zone":[{"id":"Z_TYPE","ko":"보세구역의 종류","en":"Types of Bonded Areas","goal":"지정(지정장치장·세관검사장) / 특허(창고·공장·전시장·건설장·판매장) / 종합, 세 갈래로 외우세요.","terms":[],"secs":[["보세구역 세 갈래","{{fig:zones}}"],["꼭 알아야 할 내용","<ul><li>보세구역은 지정보세구역, 특허보세구역, 종합보세구역으로 나뉜다.<\/li><li>지정보세구역에는 지정장치장과 세관검사장이 있다.<\/li><li>특허보세구역에는 보세창고, 보세공장, 보세전시장, 보세건설장, 보세판매장이 있다.<\/li><li>지정보세구역은 세관장이 지정한다.<\/li><li>특허보세구역은 세관장의 특허를 받아 설치·운영한다.<\/li><li>종합보세구역은 관세청장이 지정한다.<\/li><li>종합보세구역에서는 여러 보세구역 기능을 함께 할 수 있다.<\/li><li>지정장치장은 통관을 하려는 물품을 일시 장치하는 곳이다.<\/li><li>세관검사장은 통관하려는 물품을 검사하는 곳이다.<\/li><li>보세판매장은 외국물품을 외국으로 반출하거나 면세로 판매하는 곳(면세점)이다.<\/li><li>보세건설장은 산업시설 건설에 쓰이는 외국물품을 건설에 사용하는 곳이다.<\/li><li>보세전시장은 박람회·전시회 등에 외국물품을 전시하는 곳이다.<\/li><li>보세공장은 외국물품을 원료로 제조·가공하는 곳이다.<\/li><li>종합보세구역에 반입한 물품의 장치기간은 원칙적으로 제한이 없다.<\/li><\/ul>"],["헷갈리는 내용 바로잡기","<table><tr><th>틀린 말<\/th><th>바른 내용<\/th><\/tr><tr><td class=\"x\">지정장치장은 특허보세구역에 속한다.<\/td><td><mark class=\"hl\">지정보세구역이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세창고는 지정보세구역이다.<\/td><td><mark class=\"hl\">특허보세구역이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">종합보세구역은 세관장이 지정한다.<\/td><td><mark class=\"hl\">관세청장이 지정해요.<\/mark><\/td><\/tr><tr><td class=\"x\">특허보세구역은 관세청장에게 신고만 하면 운영할 수 있다.<\/td><td><mark class=\"hl\">세관장의 특허가 필요해요.<\/mark><\/td><\/tr><tr><td class=\"x\">세관검사장은 물품을 장기간 보관하는 곳이다.<\/td><td><mark class=\"hl\">통관 물품을 검사하는 곳이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세판매장은 특허 없이 운영할 수 있다.<\/td><td><mark class=\"hl\">특허보세구역이라 특허가 필요해요.<\/mark><\/td><\/tr><tr><td class=\"x\">종합보세구역 반입 물품의 장치기간은 1년으로 제한된다.<\/td><td><mark class=\"hl\">원칙적으로 제한이 없어요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세공장은 외국물품을 단순 보관만 하는 곳이다.<\/td><td><mark class=\"hl\">제조·가공하는 곳이에요.<\/mark><\/td><\/tr><\/table>"]],"traps":["지정장치장은 특허보세구역에 속한다. → 지정보세구역이에요.","보세창고는 지정보세구역이다. → 특허보세구역이에요.","종합보세구역은 세관장이 지정한다. → 관세청장이 지정해요."],"nquiz":4,"quiz":[{"q":"보세구역의 종류에 대한 설명으로 옳은 것은?","o":["보세공장은 외국물품을 원료로 제조·가공하는 곳이다.","종합보세구역은 세관장이 지정한다.","종합보세구역 반입 물품의 장치기간은 1년으로 제한된다.","세관검사장은 물품을 장기간 보관하는 곳이다."],"a":0,"e":"틀린 보기 바로잡기: \"종합보세구역은 세관장이 지정한다.\" → 관세청장이 지정해요. / \"세관검사장은 물품을 장기간 보관하는 곳이다.\" → 통관 물품을 검사하는 곳이에요. / \"종합보세구역 반입 물품의 장치기간은 1년으로 제한된다.\" → 원칙적으로 제한이 없어요."},{"q":"보세구역의 종류에 대한 설명으로 옳지 않은 것은?","o":["특허보세구역은 세관장의 특허를 받아 설치·운영한다.","종합보세구역에서는 여러 보세구역 기능을 함께 할 수 있다.","지정장치장은 통관을 하려는 물품을 일시 장치하는 곳이다.","특허보세구역은 관세청장에게 신고만 하면 운영할 수 있다."],"a":3,"e":"옳지 않은 것: \"특허보세구역은 관세청장에게 신고만 하면 운영할 수 있다.\" → 바른 내용: 세관장의 특허가 필요해요."},{"q":"지정보세구역에 해당하는 것은?","o":["보세공장","세관검사장","보세창고","보세판매장"],"a":1,"e":"지정 = 지정장치장·세관검사장."},{"q":"보세구역의 종류에 대한 설명으로 옳지 않은 것은?","o":["보세전시장은 박람회·전시회 등에 외국물품을 전시하는 곳이다.","세관검사장은 통관하려는 물품을 검사하는 곳이다.","세관검사장은 물품을 장기간 보관하는 곳이다.","보세공장은 외국물품을 원료로 제조·가공하는 곳이다."],"a":2,"e":"옳지 않은 것: \"세관검사장은 물품을 장기간 보관하는 곳이다.\" → 바른 내용: 통관 물품을 검사하는 곳이에요."}]},{"id":"Z_PAT","ko":"특허와 운영인","en":"Licenses & Operators","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1},{"id":"Z_STORE","ko":"장치기간과 보세공장·판매장","en":"Storage Periods, Factories & Duty-free","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1}],"cargo":[{"id":"G_INOUT","ko":"반출입과 보수작업","en":"In/Out & Repair Work","goal":"반출입은 \"신고\", 보수작업·멸각·폐기·견본품 반출은 \"승인·허가\"로 구별하세요.","terms":[],"secs":[["신고·승인·허가","{{fig:perm}}"],["꼭 알아야 할 내용","<ul><li>보세구역에 물품을 반입·반출하려면 세관장에게 신고해야 한다.<\/li><li>보세구역에 장치된 물품의 보수작업을 하려면 세관장의 승인을 받아야 한다.<\/li><li>보수작업은 물품의 보존을 위한 작업이나 포장 바꾸기·구분·분할·합병 등 성질을 바꾸지 않는 범위의 작업이다.<\/li><li>보수작업으로 외국물품에 부가된 내국물품은 외국물품으로 본다.<\/li><li>보세구역 장치 물품을 폐기하려면 세관장의 승인을 받아야 한다.<\/li><li>보세구역 물품의 견본품을 반출하려면 세관장의 허가를 받아야 한다.<\/li><li>보세구역 밖에서 보수작업을 하려면 세관장의 승인을 받아야 한다.<\/li><li>외국물품은 원칙적으로 보세구역이 아닌 곳에 장치할 수 없다.<\/li><li>수출신고가 수리된 물품은 보세구역이 아닌 곳에 장치할 수 있다.<\/li><li>크기나 무게 때문에 보세구역에 둘 수 없는 물품은 세관장 허가를 받아 보세구역 밖에 장치할 수 있다.<\/li><li>재해나 부득이한 사유로 멸실된 외국물품은 관세를 징수하지 않는다.<\/li><li>보세구역 외 장치 허가를 받으면 허가수수료를 낸다.<\/li><li>화물관리번호는 적재화물목록 단위로 화물을 관리하는 번호이다.<\/li><\/ul>"],["헷갈리는 내용 바로잡기","<table><tr><th>틀린 말<\/th><th>바른 내용<\/th><\/tr><tr><td class=\"x\">보세구역 물품 반출입은 세관장의 허가를 받아야 한다.<\/td><td><mark class=\"hl\">반출입은 신고예요.<\/mark><\/td><\/tr><tr><td class=\"x\">보수작업은 세관장에게 신고만 하면 된다.<\/td><td><mark class=\"hl\">세관장의 승인이 필요해요.<\/mark><\/td><\/tr><tr><td class=\"x\">보수작업으로 성질을 완전히 바꾸는 가공도 할 수 있다.<\/td><td><mark class=\"hl\">성질을 바꾸지 않는 범위의 작업만 돼요.<\/mark><\/td><\/tr><tr><td class=\"x\">보수작업에 쓰인 내국물품은 계속 내국물품으로 본다.<\/td><td><mark class=\"hl\">외국물품으로 봐요.<\/mark><\/td><\/tr><tr><td class=\"x\">견본품 반출은 운영인의 확인만 있으면 된다.<\/td><td><mark class=\"hl\">세관장의 허가가 필요해요.<\/mark><\/td><\/tr><tr><td class=\"x\">외국물품은 어디든 자유롭게 장치할 수 있다.<\/td><td><mark class=\"hl\">원칙적으로 보세구역에 장치해요.<\/mark><\/td><\/tr><tr><td class=\"x\">재해로 멸실된 외국물품도 관세를 징수한다.<\/td><td><mark class=\"hl\">징수하지 않아요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세구역 장치 물품은 운영인이 마음대로 폐기할 수 있다.<\/td><td><mark class=\"hl\">세관장의 승인이 필요해요.<\/mark><\/td><\/tr><\/table>"]],"traps":["보세구역 물품 반출입은 세관장의 허가를 받아야 한다. → 반출입은 신고예요.","보수작업은 세관장에게 신고만 하면 된다. → 세관장의 승인이 필요해요.","보수작업으로 성질을 완전히 바꾸는 가공도 할 수 있다. → 성질을 바꾸지 않는 범위의 작업만 돼요."],"nquiz":4,"quiz":[{"q":"반출입과 보수작업에 대한 설명으로 옳은 것은?","o":["견본품 반출은 운영인의 확인만 있으면 된다.","보수작업으로 성질을 완전히 바꾸는 가공도 할 수 있다.","보세구역에 물품을 반입·반출하려면 세관장에게 신고해야 한다.","보수작업에 쓰인 내국물품은 계속 내국물품으로 본다."],"a":2,"e":"틀린 보기 바로잡기: \"보수작업으로 성질을 완전히 바꾸는 가공도 할 수 있다.\" → 성질을 바꾸지 않는 범위의 작업만 돼요. / \"보수작업에 쓰인 내국물품은 계속 내국물품으로 본다.\" → 외국물품으로 봐요. / \"견본품 반출은 운영인의 확인만 있으면 된다.\" → 세관장의 허가가 필요해요."},{"q":"반출입과 보수작업에 대한 설명으로 옳은 것을 <b>모두<\/b> 고른 것은?","o":["ㄱ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":1,"e":"ㄱ(O) / ㄴ(X) → 반출입은 신고예요. / ㄷ(O) / ㄹ(X) → 원칙적으로 보세구역에 장치해요.","p":"ㄱ. 보세구역 외 장치 허가를 받으면 허가수수료를 낸다.<br>ㄴ. 보세구역 물품 반출입은 세관장의 허가를 받아야 한다.<br>ㄷ. 크기나 무게 때문에 보세구역에 둘 수 없는 물품은 세관장 허가를 받아 보세구역 밖에 장치할 수 있다.<br>ㄹ. 외국물품은 어디든 자유롭게 장치할 수 있다."},{"q":"반출입과 보수작업에 대한 설명으로 옳은 것은?","o":["보세구역 장치 물품은 운영인이 마음대로 폐기할 수 있다.","보수작업으로 외국물품에 부가된 내국물품은 외국물품으로 본다.","재해로 멸실된 외국물품도 관세를 징수한다.","보수작업으로 성질을 완전히 바꾸는 가공도 할 수 있다."],"a":1,"e":"틀린 보기 바로잡기: \"보수작업으로 성질을 완전히 바꾸는 가공도 할 수 있다.\" → 성질을 바꾸지 않는 범위의 작업만 돼요. / \"재해로 멸실된 외국물품도 관세를 징수한다.\" → 징수하지 않아요. / \"보세구역 장치 물품은 운영인이 마음대로 폐기할 수 있다.\" → 세관장의 승인이 필요해요."},{"q":"반출입과 보수작업에 대한 설명으로 옳지 않은 것은?","o":["보세구역 외 장치 허가를 받으면 허가수수료를 낸다.","보수작업으로 외국물품에 부가된 내국물품은 외국물품으로 본다.","외국물품은 어디든 자유롭게 장치할 수 있다.","보세구역 장치 물품을 폐기하려면 세관장의 승인을 받아야 한다."],"a":2,"e":"옳지 않은 것: \"외국물품은 어디든 자유롭게 장치할 수 있다.\" → 바른 내용: 원칙적으로 보세구역에 장치해요."}]},{"id":"G_TRANS","ko":"보세운송과 적재화물목록","en":"Bonded Transport & Manifest","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1},{"id":"G_LONG","ko":"장치기간 경과물품(체화) 처리","en":"Overdue Goods","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1}],"aeo":[{"id":"A_AEO","ko":"AEO(수출입 안전관리 우수업체)","en":"AEO Program","goal":"공인등급 A·AA·AAA, 공인기준 4가지, 유효기간 5년을 외우세요.","terms":[],"secs":[["공인등급","{{fig:aeo}}"],["꼭 알아야 할 내용","<ul><li>AEO는 수출입 안전관리 우수업체(Authorized Economic Operator)를 뜻한다.<\/li><li>AEO 공인은 관세청장이 한다.<\/li><li>AEO 공인등급은 A, AA, AAA로 나뉜다.<\/li><li>AEO 공인기준은 법규준수, 내부통제시스템, 재무건전성, 안전관리이다.<\/li><li>AEO 공인을 받으려면 법규준수 기준에서 일정 점수(80점) 이상을 받아야 한다.<\/li><li>AEO 공인의 유효기간은 5년이다.<\/li><li>AEO 공인을 갱신하려면 유효기간이 끝나기 전에 종합심사를 받아야 한다.<\/li><li>AEO 업체는 검사 비율 축소 같은 통관 혜택을 받을 수 있다.<\/li><li>AEO 공인 대상에는 수출입업체, 관세사, 보세구역 운영인, 운송업체 등이 포함된다.<\/li><li>AEO 업체는 변동 사항이 생기면 관세청장에게 보고해야 한다.<\/li><li>공인등급이 높을수록 더 많은 혜택을 받는다.<\/li><li>AEO 업체는 관리책임자를 지정해 교육을 받게 해야 한다.<\/li><\/ul>"],["헷갈리는 내용 바로잡기","<table><tr><th>틀린 말<\/th><th>바른 내용<\/th><\/tr><tr><td class=\"x\">AEO 공인은 세관장이 한다.<\/td><td><mark class=\"hl\">관세청장이 해요.<\/mark><\/td><\/tr><tr><td class=\"x\">AEO 공인등급은 1등급부터 5등급까지 있다.<\/td><td><mark class=\"hl\">A·AA·AAA 세 등급이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">AEO 공인의 유효기간은 10년이다.<\/td><td><mark class=\"hl\">5년이에요.<\/mark><\/td><\/tr><tr><td class=\"x\">AEO 공인기준에 매출 규모가 포함된다.<\/td><td><mark class=\"hl\">법규준수·내부통제·재무건전성·안전관리예요.<\/mark><\/td><\/tr><tr><td class=\"x\">AEO 업체는 변동 사항을 보고할 의무가 없다.<\/td><td><mark class=\"hl\">관세청장에게 보고해야 해요.<\/mark><\/td><\/tr><tr><td class=\"x\">AEO 공인은 수입업체만 받을 수 있다.<\/td><td><mark class=\"hl\">운영인·관세사·운송업체 등도 받아요.<\/mark><\/td><\/tr><tr><td class=\"x\">공인등급과 관계없이 혜택은 모두 같다.<\/td><td><mark class=\"hl\">등급이 높을수록 혜택이 많아요.<\/mark><\/td><\/tr><\/table>"]],"traps":["AEO 공인은 세관장이 한다. → 관세청장이 해요.","AEO 공인등급은 1등급부터 5등급까지 있다. → A·AA·AAA 세 등급이에요.","AEO 공인의 유효기간은 10년이다. → 5년이에요."],"nquiz":4,"quiz":[{"q":"AEO(수출입 안전관리 우수업체)에 대한 설명으로 옳지 않은 것은?","o":["AEO 업체는 검사 비율 축소 같은 통관 혜택을 받을 수 있다.","AEO 공인은 수입업체만 받을 수 있다.","AEO 업체는 관리책임자를 지정해 교육을 받게 해야 한다.","AEO 공인은 관세청장이 한다."],"a":1,"e":"옳지 않은 것: \"AEO 공인은 수입업체만 받을 수 있다.\" → 바른 내용: 운영인·관세사·운송업체 등도 받아요."},{"q":"AEO(수출입 안전관리 우수업체)에 대한 설명으로 옳은 것을 <b>모두<\/b> 고른 것은?","o":["ㄷ","ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ"],"a":0,"e":"ㄱ(X) → 관세청장에게 보고해야 해요. / ㄴ(X) → 등급이 높을수록 혜택이 많아요. / ㄷ(O) / ㄹ(X) → A·AA·AAA 세 등급이에요.","p":"ㄱ. AEO 업체는 변동 사항을 보고할 의무가 없다.<br>ㄴ. 공인등급과 관계없이 혜택은 모두 같다.<br>ㄷ. AEO는 수출입 안전관리 우수업체(Authorized Economic Operator)를 뜻한다.<br>ㄹ. AEO 공인등급은 1등급부터 5등급까지 있다."},{"q":"AEO(수출입 안전관리 우수업체)에 대한 설명으로 옳지 않은 것은?","o":["AEO 공인의 유효기간은 5년이다.","AEO 업체는 관리책임자를 지정해 교육을 받게 해야 한다.","AEO 공인은 관세청장이 한다.","AEO 업체는 변동 사항을 보고할 의무가 없다."],"a":3,"e":"옳지 않은 것: \"AEO 업체는 변동 사항을 보고할 의무가 없다.\" → 바른 내용: 관세청장에게 보고해야 해요."},{"q":"AEO(수출입 안전관리 우수업체)에 대한 설명으로 옳지 않은 것은?","o":["AEO 공인등급은 A, AA, AAA로 나뉜다.","AEO 업체는 관리책임자를 지정해 교육을 받게 해야 한다.","AEO 공인은 관세청장이 한다.","공인등급과 관계없이 혜택은 모두 같다."],"a":3,"e":"옳지 않은 것: \"공인등급과 관계없이 혜택은 모두 같다.\" → 바른 내용: 등급이 높을수록 혜택이 많아요."}]},{"id":"A_INTL","ko":"국제 공급망 보안","en":"International Supply Chain Security","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1},{"id":"A_PORT","ko":"국제항·운송수단·감시","en":"Ports, Carriers & Surveillance","goal":"","terms":[],"secs":[],"traps":[],"quiz":[],"locked":1}],"pen":[{"id":"P_SELF","ko":"자율관리보세구역과 보세사","en":"Self-managed Areas & Bonded Officers","goal":"보세사 직무(반출입 참관·입회·열쇠 관리)와 징계 3가지(경고·업무정지·등록취소)를 외우세요.","terms":[],"secs":[["꼭 알아야 할 내용","<ul><li>자율관리보세구역은 운영인이 물품 관리를 스스로 하도록 세관장이 지정한 보세구역이다.<\/li><li>자율관리보세구역으로 지정받으려면 보세사를 채용해야 한다.<\/li><li>자율관리보세구역은 화물 반출입 사항을 전산으로 관리해야 한다.<\/li><li>자율관리보세구역에서는 일부 세관 절차가 생략되거나 간소화된다.<\/li><li>운영인은 자율관리보세구역 운영 실태를 매년 자체 점검해 세관장에게 보고해야 한다.<\/li><li>보세사는 보세화물과 내국물품의 반입·반출에 참관하고 확인한다.<\/li><li>보세사는 보세구역 안에서 물품을 취급할 때 입회하고 확인한다.<\/li><li>보세사는 보세구역 출입문 개폐와 열쇠 관리를 감독한다.<\/li><li>보세사는 견본품 반출과 회수를 확인한다.<\/li><li>보세사가 되려면 보세사 시험에 합격하고 세관장에게 등록해야 한다.<\/li><li>보세사 징계에는 경고, 6개월 범위의 업무정지, 등록취소가 있다.<\/li><li>보세사가 연간 6개월 범위 업무정지를 2회 받으면 등록이 취소될 수 있다.<\/li><li>자율관리보세구역 운영인은 보세사가 퇴사하면 2개월 이내에 다른 보세사를 채용해야 한다.<\/li><\/ul>"],["헷갈리는 내용 바로잡기","<table><tr><th>틀린 말<\/th><th>바른 내용<\/th><\/tr><tr><td class=\"x\">자율관리보세구역은 보세사 없이도 지정받을 수 있다.<\/td><td><mark class=\"hl\">보세사를 채용해야 해요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세사는 관세청장에게 등록한다.<\/td><td><mark class=\"hl\">세관장에게 등록해요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세사 징계에는 벌금형이 포함된다.<\/td><td><mark class=\"hl\">경고·업무정지·등록취소예요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세사 업무정지는 최대 2년이다.<\/td><td><mark class=\"hl\">6개월 범위예요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세사가 퇴사하면 1년 안에만 새로 채용하면 된다.<\/td><td><mark class=\"hl\">2개월 이내예요.<\/mark><\/td><\/tr><tr><td class=\"x\">자율관리보세구역은 자체 점검을 할 필요가 없다.<\/td><td><mark class=\"hl\">매년 자체 점검해 보고해요.<\/mark><\/td><\/tr><tr><td class=\"x\">보세사는 수입 관세를 부과·징수한다.<\/td><td><mark class=\"hl\">세관 업무예요. 보세사는 물품 관리를 확인해요.<\/mark><\/td><\/tr><\/table>"]],"traps":["자율관리보세구역은 보세사 없이도 지정받을 수 있다. → 보세사를 채용해야 해요.","보세사는 관세청장에게 등록한다. → ㄴ(O) / ㄷ(X) → 원칙은 그 물품을 수입한 화주예요. / ㄹ(O)","p":"ㄱ. 관세는 수입신고를 하는 때의 물품 성질과 수량에 따라 부과한다.<br>ㄴ. 외국물품에는 외국에서 들어와 수입신고가 수리되기 전의 물품이 포함된다.<br>ㄷ. 수입물품의 납세의무자는 원칙적으로 운송인이다.<br>ㄹ. 과세가격은 원칙적으로 실제로 지급했거나 지급할 가격에 가산요소를 더해 정한다.","fixed":true,"d":2},"bs0118":{"id":"bs0118","s":"cus","t":"C_IMP","q":"수입·수출 신고와 수리에 대한 설명으로 옳은 것은?","o":["수입신고 수리 전에 물품을 반출하려면 세관장의 승인을 받아야 한다.","반송은 수입신고를 수리한 후 다시 외국으로 보내는 것이다.","수입신고 수리 전 반출은 운영인의 승인만 있으면 된다.","보세구역 반입 물품은 반입일부터 60일 이내에 수입신고를 하면 된다."],"a":0,"e":"틀린 보기 바로잡기: \"보세구역 반입 물품은 반입일부터 60일 이내에 수입신고를 하면 된다.\" → 30일 이내예요. / \"수입신고 수리 전 반출은 운영인의 승인만 있으면 된다.\" → 세관장의 승인이 필요해요. / \"반송은 수입신고를 수리한 후 다시 외국으로 보내는 것이다.\" → 수입신고 수리 없이 다시 외국으로 보내는 거예요.","d":1},"bs0126":{"id":"bs0126","s":"cus","t":"C_IMP","q":"수입·수출 신고와 수리에 대한 설명으로 옳은 것을 <b>모두<\/b> 고른 것은?","o":["ㄴ","ㄷ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":2,"e":"ㄱ(X) → 출항 전·입항 전 신고도 가능해요. / ㄴ(O) / ㄷ(O) / ㄹ(X) → 세관장의 승인이 필요해요.","p":"ㄱ. 수입신고는 입항 후에만 할 수 있다.<br>ㄴ. 수입신고 수리 전 반출 승인 시 세관장은 관세에 상당하는 담보를 요구할 수 있다.<br>ㄷ. 수입신고 시기에는 출항 전 신고, 입항 전 신고, 보세구역 도착 전 신고, 보세구역 장치 후 신고가 있다.<br>ㄹ. 수입신고 수리 전 반출은 운영인의 승인만 있으면 된다.","fixed":true,"d":2},"bs0136":{"id":"bs0136","s":"cus","t":"C_IMP","q":"수입·수출 신고와 수리에 대한 설명으로 옳은 것은?","o":["수입신고는 화주만 할 수 있고 관세사는 할 수 없다.","수입신고는 입항 후에만 할 수 있다.","수입신고는 화주 또는 관세사 등이 할 수 있다.","여행자 휴대품 면세 한도는 미화 400달러이다."],"a":2,"e":"틀린 보기 바로잡기: \"수입신고는 화주만 할 수 있고 관세사는 할 수 없다.\" → 관세사·관세법인 등도 대리 신고할 수 있어요. / \"여행자 휴대품 면세 한도는 미화 400달러이다.\" → 800달러예요. / \"수입신고는 입항 후에만 할 수 있다.\" → 출항 전·입항 전 신고도 가능해요.","d":0},"bs0137":{"id":"bs0137","s":"cus","t":"C_IMP","q":"수입·수출 신고와 수리에 대한 설명으로 옳지 않은 것은?","o":["통관이란 관세법에 따라 물품을 수출·수입 또는 반송하는 것이다.","수입신고 기한을 넘기면 과세가격의 2% 범위에서 가산세가 붙는다.","반송은 수입신고를 수리한 후 다시 외국으로 보내는 것이다.","여행자 휴대품 면세 한도는 미화 800달러이다."],"a":2,"e":"옳지 않은 것: \"반송은 수입신고를 수리한 후 다시 외국으로 보내는 것이다.\" → 바른 내용: 수입신고 수리 없이 다시 외국으로 보내는 거예요.","d":1},"bs0149":{"id":"bs0149","s":"cus","t":"C_IMP","q":"수입·수출 신고와 수리에 대한 설명으로 옳지 않은 것은?","o":["수입신고 수리 전에 물품을 반출하려면 세관장의 승인을 받아야 한다.","수입신고는 화주 또는 관세사 등이 할 수 있다.","수출물품 적재 기간은 1년 범위에서 연장할 수 있다.", (function(){

/* ---------- scoring ---------- */
/* 실제 시험 점수 척도: D.score = {type, cut, fail, lo, hi, pts, note}, 과목별 덮어쓰기 SUB[k].sc */
function SC(k){return Object.assign({type:'pct',max:100,cut:D.pass.cut||60},D.score||{},(SUB[k]||{}).sc||{});}
function interp(p,pts){for(let i=1;i<pts.length;i++){if(p<=pts[i][0]){const a=pts[i-1],b=pts[i];return a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0]);}}return pts[pts.length-1][1];}
function sval(c,N,k){const s=SC(k),p=N?c/N:0;
 if(s.type==='scale')return Math.round(interp(p,s.pts));
 if(s.type==='ap')return p>=s.pts[3]?5:p>=s.pts[2]?4:p>=s.pts[1]?3:p>=s.pts[0]?2:1;
 if(s.type==='pf')return Math.round(p*100);
 return Math.round(p*s.max);}
function need(sub,N){const p=D.pass;if(p.mode==='count')return Math.ceil(p.need*N/p.of-1e-9);let c=0;while(c<N&&sval(c,N,sub)<SC(sub).cut)c++;return c;}
function scoreTxt(c,N,k){if(D.pass.mode==='count')return `${c}/${N}`;const s=SC(k),v=sval(c,N,k);
 if(s.type==='scale')return `${v}점<small class="muted" style="font-size:.5em"> (${s.lo}~${s.hi}점 척도)</small>`;
 if(s.type==='ap')return `${v}점<small class="muted" style="font-size:.5em"> (1~5점)</small>`;
 if(s.type==='pf')return `정답률 ${v}%`;
 return `${v}점<small class="muted" style="font-size:.5em"> / ${s.max}점</small>`;}
function cutTxt(sub,N){if(D.pass.mode==='count')return `${need(sub,N)}개 이상 맞히면 합격`;const s=SC(sub);
 return s.note||`${s.cut}점 이상 합격`;}
const isPass=(c,N,sub)=>D.pass.mode==='count'?c>=need(sub,N):sval(c,N,sub)>=SC(sub).cut;
const isFail=(c,N,sub)=>D.pass.mode!=='count'&&SC(sub).fail!=null&&sval(c,N,sub)<SC(sub).fail;
const cls=p=>p<0.6?'bad':p<0.8?'mid':'good';
function attList(k){return Object.entries(DB.att[k]||{}).map(([n,a])=>Object.assign({n:+n},a)).sort((a,b)=>a.ts-b.ts);}

function chDone(k,t){return DB.done[k+'-'+t]||0;}

const chHref=(k,t)=>`#ch-${k}-${t}`;
const hasCh=(k,t)=>(D.book[k]||[]).some(c=>c.id===t);
const tLabel=(k,t)=>{const x=SUB[k].topics[t];const nm=x[0];return hasCh(k,t)?`<a href="${chHref(k,t)}">${esc(nm)}</a>`:esc(nm);};
const NT=k=>D.tests[k].length;

function nextStep(){

 D.subjects.forEach((s,i)=>{const l=latest(s.k),tests=D.tests[s.k];

  const weak=Object.entries(l.tp).filter(([t,v])=>v[1]&&v[0]/v[1]<0.6&&hasCh(s.k,t)&&chDone(s.k,t)<l.ts).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  if(weak.length){const t=weak[0][0];cands.push({pr:1,i,k:s.k,sc:l.c/l.N,title:`교재 「${SUB[s.k].topics[t][0]}」 단원 공부`,why:`최근 ${l.n}회에서 이 영역 정답률이 ${Math.round(weak[0][1][0]/weak[0][1][1]*100)}%였어요. 단원을 읽고 '다 읽었어요'를 눌러 주세요.`,href:chHref(s.k,t),btn:'공부하러 가기'});return;}
  const undone=tests.map((_,j)=>j+1).find(n=>!(DB.att[s.k]||{})[n]);
  if(undone){cands.push({pr:undone>=tests.length-1?3:2,i,k:s.k,sc:l.c/l.N,title:`${s.ko} ${undone}회 ${undone>=tests.length-1?'실전':'연습'} 모의고사`,why:undone>=tests.length-1?'실전처럼 시간 제한을 켜고 풀어 보세요.':'약한 부분이 나아졌는지 확인해요.',href:`#exam-${s.k}-${undone}`,btn:'풀기'});return;}
  cands.push({pr:4,i,k:s.k,sc:l.c/l.N,title:`${s.ko} 오답 다시 풀기`,why:'10회를 다 풀었어요. 틀린 문제만 모아 다시 풀어 보세요.',href:'#wrong',btn:'오답노트'});
 });
 cands.sort((a,b)=>a.pr-b.pr||(a.sc||0)-(b.sc||0)||a.i-b.i);return cands[0];
}

const MALE=/injoon|hyunsu|bongjin|gookmin|\bmale\b|남성/i,FEMALE=/sunhi|heami|jimin|seohyeon|yujin|yuna|female|여성|google/i;
function koVoices(){try{return speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));}catch(e){return[];}}
function pickVoice(g){const vs=koVoices().slice().sort((a,b)=>(/natural|online|neural/i.test(b.name)?1:0)-(/natural|online|neural/i.test(a.name)?1:0));if(!vs.length)return null;
 if(g==='m')return vs.find(v=>MALE.test(v.name))||null;
 return vs.find(v=>FEMALE.test(v.name)&&!MALE.test(v.name))||vs.find(v=>!MALE.test(v.name))||vs[0];}
function vNote(){const has=!!pickVoice('m');document.querySelectorAll('.vnote').forEach(e=>e.textContent=has?'':'이 브라우저에는 한국어 남자 음성이 없어서 남자 대사도 여자 목소리로 나와요. Microsoft Edge로 이 파일을 열면 남자 목소리가 나와요.');}
function speak(txt){const ss=window.speechSynthesis;if(!ss){alert('이 브라우저는 음성 재생을 지원하지 않아요. 대본을 보세요.');return;}ss.cancel();
 const vs=koVoices(),fv=pickVoice('f'),mv=pickVoice('m');
 txt.split('\n').forEach(line=>{const m=line.match(/^\s*(남자|여자|남|여)\s*[:：]\s*/);const t=m?line.slice(m[0].length):line;if(!t.trim())return;
  const male=m&&m[1][0]==='남';const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=0.92;u.pitch=1;u.volume=1;
  const v=male?(mv||fv):fv;if(v)u.voice=v;
  if(male&&!mv)u.rate=0.85;
  ss.speak(u);});
 vNote();
 if(!vs.length)setTimeout(()=>{if(!ss.speaking)alert('한국어 음성이 없어 소리가 안 날 수 있어요. 대본 보기를 눌러 주세요.');},1200);}
function vExam(){setNav('tests');const E=S.ex,s=SUB[E.k],qid=E.qs[E.cur],q=Q[qid],answered=E.ans.filter(a=>a>=0).length;
 document.body.classList.add('in-exam');
 return `<div class="exhead"><div class="wrap"><span class="t">${esc(s.ko)} ${E.wrong?'오답 다시 풀기':E.n+'회'}</span>${E.timed?`<span class="timer" id="timer"></span>`:''}<span class="num">${answered}/${E.qs.length} 답함</span><button class="btn sm" id="quit">나가기</button><button class="primary" id="submit">제출</button></div><div class="prog"><i style="width:${answered/E.qs.length*100}%"></i></div></div>
 <main class="wrap">${E.timed&&E.cur===0&&s.real?`<p class="muted small" style="margin:0 0 8px">⏱ ${tmNote(s)}</p>`:''}<div class="qcard">${qBlock(q,E.ans[E.cur],false,E.cur)}
 <div class="exnav"><button class="btn" id="prev" ${E.cur?'':'disabled'}>← 이전</button><button class="btn" id="flag">${E.flag[E.cur]?'★ 표시 해제':'☆ 나중에 다시 보기'}</button><button class="${E.cur<E.qs.length-1?'primary':'btn'}" id="nextQ" ${E.cur<E.qs.length-1?'':'disabled'}>다음 →</button></div></div>
 <section class="panel"><h2>문항 이동</h2><div class="qgrid">${E.qs.map((_,i)=>`<button data-g="${i}" class="${E.ans[i]>=0?'done':''} ${i===E.cur?'cur':''} ${E.flag[i]?'flag':''}">${i+1}</button>`).join('')}</div></section></main>`;}
function tick(){const el=$('#timer');if(!el||!S.ex)return;const L=S.ex.left;el.textContent=`${Math.floor(L/60)}:${String(L%60).padStart(2,'0')}`;el.classList.toggle('low',L<120);}
function grade(){const E=S.ex,s=SUB[E.k];let c=0;const tp={};const wrong=[];
 E.qs.forEach((id,i)=>{const q=Q[id];tp[q.t]=tp[q.t]||[0,0];tp[q.t][1]++;if(E.ans[i]===q.a){c++;tp[q.t][0]++;}else wrong.push(id);});
 const r={c,N:E.qs.length,tp,ans:E.ans.slice(),date:new Date().toISOString().slice(0,10),ts:Date.now(),wrong};
 if(!E.wrong){DB.att[E.k]=DB.att[E.k]||{};DB.att[E.k][E.n]=r;}
 DB.w=DB.w||{};E.qs.forEach((id,i)=>{if(E.ans[i]===Q[id].a){if(DB.w[id])DB.w[id].fix=1;}else DB.w[id]={k:E.k,ts:Date.now(),fix:0};});
 save();S.res=r;S.view='result';}
function vResult(){setNav('tests');const E=S.ex,R=S.res,s=SUB[E.k],pass=isPass(R.c,R.N,E.k);document.body.classList.remove('in-exam');
 const rows=Object.entries(R.tp).map(([t,v])=>({t,v,p:v[0]/v[1]})).sort((a,b)=>a.p-b.p);
 const weak=rows.filter(r=>r.p<0.6);
 return hero(esc(s.en)+(E.wrong?' · Review':' · Test '+E.n),`${esc(s.ko)} ${E.wrong?'오답 다시 풀기':E.n+'회'} 결과`,'')+`<main class="wrap">
 <section class="panel"><div class="score"><span class="big">${scoreTxt(R.c,R.N,E.k)}</span><span class="verdict ${pass?'pass':'fail'}">${pass?'합격선 통과':isFail(R.c,R.N,E.k)?`과락 (${SC(E.k).fail}점 미만)`:'합격선 미달'}</span><span class="muted">${R.c}문제 맞힘 / ${R.N}문제 · ${cutTxt(E.k,R.N)}</span></div>
 <div class="actions">${weak.length&&hasCh(E.k,weak[0].t)?`<a class="primary" href="${chHref(E.k,weak[0].t)}">약한 단원부터 공부하기 →</a>`:''}<a class="${weak.length?'btn':'primary'}" href="#home">대시보드에서 다음 할 일 보기</a>${!E.wrong&&E.n<D.tests[E.k].length?`<a class="btn" href="#exam-${E.k}-${E.n+1}">${E.n+1}회 풀기 →</a>`:''}<a class="btn" href="#tests-${E.k}">회차 목록</a></div></section>
 ${(()=>{const L=[[0,0],[0,0],[0,0]];E.qs.forEach((id,i)=>{const q=Q[id];if(q.d==null)return;L[q.d][1]++;if(R.ans[i]===q.a)L[q.d][0]++;});return L.some(x=>x[1])?`<section class="panel"><h2>난이도별 점수</h2>${L.map((v,d)=>v[1]?bar(LV[d],v[0]/v[1],`${v[0]}/${v[1]}`):'').join('')}</section>`:'';})()}
 <section class="panel"><h2>영역별 점수</h2>${rows.map(r=>bar(tLabel(E.k,r.t),r.p,`${r.v[0]}/${r.v[1]}`)).join('')}</section>
 ${weak.length?`<section class="panel"><h2>약점 분석</h2><ul class="tips">${weak.map(r=>`<li><b>${esc(s.topics[r.t][0])}</b> ${r.v[0]}/${r.v[1]}<br>${s.topics[r.t][2]||''}${hasCh(E.k,r.t)?`<br><a href="${chHref(E.k,r.t)}">교재 「${esc(s.topics[r.t][0])}」 단원 공부하기 →</a>`:''}</li>`).join('')}</ul></section>`:''}
 <section class="panel"><h2>문제 다시 보기</h2><p class="muted small" style="margin-top:0">틀린 문제는 오답노트에 자동으로 모여요.</p>${E.qs.map((id,i)=>{const q=Q[id];return `<div class="rv">${qBlock(q,R.ans[i],true,i)}<div class="expl"><b>${R.ans[i]===q.a?'✓ 정답':'✗ 오답'}</b> · 정답 ${'ABCDE'[q.a]}<br>${q.e||''}</div></div>`;}).join('')}</section></main>`;}

function wrongIds(){return Object.entries(DB.w||{}).filter(([id,v])=>!v.fix&&Q[id]).sort((a,b)=>b[1].ts-a[1].ts).map(x=>x[0]);}
function vWrong(){setNav('wrong');const ids=wrongIds();
 const by={};ids.forEach(id=>{const k=Q[id].s;(by[k]=by[k]||[]).push(id);});
 return hero('Wrong-Answer Notes','오답노트','모의고사에서 틀린 문제가 자동으로 모여요. 다시 풀어서 맞히면 목록에서 빠져요.')+`<main class="wrap">${ids.length?D.subjects.filter(s=>by[s.k]).map(s=>`<section class="panel"><h2>${esc(s.ko)} <span class="tag bad">${by[s.k].length}문제</span></h2><div class="actions" style="margin-top:0"><button class="primary" data-wr="${s.k}">오답만 다시 풀기 (${Math.min(by[s.k].length,s.n)}문제)</button></div>${by[s.k].slice(0,30).map((id,i)=>{const q=Q[id];return `<div class="rv">${qBlock(q,-1,true,i)}<div class="expl">${q.e||''}</div></div>`;}).join('')}</section>`).join(''):`<section class="panel"><p>아직 틀린 문제가 없어요. <a href="#tests">모의고사</a>를 먼저 풀어 보세요.</p></section>`}</main>`;}

/* ---------- router ---------- */
function route(){clearInterval(S.tick);const h=(location.hash||'#home').slice(1);const p=h.split('-');let html;
 if(S.view==='exam'&&p[0]==='exam'&&S.ex&&S.ex.k===p[1]&&String(S.ex.n)===p[2]){html=vExam();}
 else if(p[0]==='exam'&&D.trial&&SUB[p[1]]&&+p[2]>1){S.view='lock';html=vLock();}
 else if(p[0]==='exam'&&SUB[p[1]]&&+p[2]>=1&&+p[2]<=D.tests[p[1]].length){startExam(p[1],+p[2]);html=vExam();}
 else{S.view=p[0];document.body.classList.remove('in-exam');
  if(p[0]==='res'&&S.res&&S.ex)html=vResult();
  else if(p[0]==='book')html=vBook();
  else if(p[0]==='ch'&&SUB[p[1]])html=vChapter(p[1],p.slice(2).join('-'));
  else if(p[0]==='tests'&&SUB[p[1]])html=vTestList(p[1]);
  else if(p[0]==='tests')html=vTests();
  else if(p[0]==='wrong')html=vWrong();
  else html=vHome();}
 $('#app').innerHTML=html;window.scrollTo(0,0);
 if(S.view==='exam'&&S.ex.timed){tick();S.tick=setInterval(()=>{S.ex.left--;tick();if(S.ex.left<=0){clearInterval(S.tick);alert('시간이 끝났어요. 자동으로 제출합니다.');grade();go('#res');}},1000);}}
function go(h){if(location.hash===h)route();else location.hash=h;}
function rerender(){const y=window.scrollY;const h=(location.hash||'#home').slice(1);if(S.view==='exam'){$('#app').innerHTML=vExam();if(S.ex.timed)tick();}else{route();window.scrollTo(0,y);}}
window.addEventListener('hashchange',()=>{if(S.view==='exam'&&!location.hash.startsWith('#exam')&&!location.hash.startsWith('#res')){if(!confirm('시험을 그만둘까요? 답한 내용은 저장되지 않아요.')){history.back();return;}S.view='';document.body.classList.remove('in-exam');}route();});

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.au!=null){speak(t.dataset.au);return;}
 if(S.view==='exam'){const E=S.ex;
  if(t.dataset.o!=null){E.ans[E.cur]=+t.dataset.o;$('#app').innerHTML=vExam();if(E.timed)tick();return;}
  if(t.id==='prev'&&E.cur>0){E.cur--;rerender();return;}
  if(t.id==='nextQ'&&E.cur<E.qs.length-1){E.cur++;rerender();window.scrollTo(0,0);return;}
  if(t.id==='flag'){E.flag[E.cur]=!E.flag[E.cur];rerender();return;}
  if(t.dataset.g!=null){E.cur=+t.dataset.g;rerender();window.scrollTo(0,0);return;}
  if(t.id==='submit'){const un=E.ans.filter(a=>a<0).length;if(!confirm(un?`안 푼 문제가 ${un}개 있어요. 그래도 제출할까요?`:'제출하고 채점할까요?'))return;clearInterval(S.tick);grade();S.view='result';history.replaceState(null,'','#res');route();return;}
  if(t.id==='quit'){if(confirm('시험을 그만둘까요? 답한 내용은 저장되지 않아요.')){S.view='';clearInterval(S.tick);document.body.classList.remove('in-exam');location.hash='#tests-'+E.k;}return;}
  return;}
 if(t.dataset.mo!=null){const box=t.closest('[data-mq]'),c=D.book[location.hash.split('-')[1]].find(x=>x.id===location.hash.split('-').slice(2).join('-'));const q=c.quiz[+box.dataset.mq];
  box.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===+t.dataset.mo)b.classList.add('wrong');});box.querySelector('.expl').hidden=false;
  box.querySelector('.expl').insertAdjacentHTML('afterbegin',`<b>${+t.dataset.mo===q.a?'✓ 정답':'✗ 오답'}</b> · 정답 ${'ABCDE'[q.a]}<br>`);return;}
 if(t.id==='doneBtn'){const key=t.dataset.k+'-'+t.dataset.t;if(DB.done[key])delete DB.done[key];else DB.done[key]=Date.now();save();rerender();return;}
 if(t.dataset.fs){DB.set.fs=+t.dataset.fs;save();applySet();rerender();return;}
 if(t.dataset.ko!=null){DB.set.ko=+t.dataset.ko;save();rerender();return;}
 if(t.dataset.tm!=null){DB.set.tmr=+t.dataset.tm;save();rerender();return;}
 if(t.dataset.wr){const k=t.dataset.wr;const ids=wrongIds().filter(id=>Q[id].s===k).slice(0,SUB[k].n);startExam(k,0,ids);history.pushState(null,'','#exam-'+k+'-w');$('#app').innerHTML=vExam();window.scrollTo(0,0);return;}
 if(t.id==='resetAll'){if(confirm('모든 기록(점수, 완료 표시, 오답노트)을 지울까요? 되돌릴 수 없어요.')){DB={att:{},done:{},set:DB.set};save();rerender();}return;}
 if(t.id==='copyRes'){const L=[D.title+' 학습 기록 ('+new Date().toISOString().slice(0,10)+')'];D.subjects.forEach(s=>{const l=latest(s.k);L.push(`- ${s.ko}: ${l?`최근 ${l.n}회 ${scoreTxt(l.c,l.N,s.k).replace(/<[^>]+>/g,'')} (${isPass(l.c,l.N,s.k)?'합격선 통과':'미달'}), ${Object.keys(DB.att[s.k]||{}).length}/${D.tests[s.k].length}회 완료`:'아직 안 풂'}`);});
  const nx=nextStep();L.push('다음 할 일: '+nx.title);const txt=L.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('복사했어요. 카톡이나 문자에 붙여넣으세요.'),()=>prompt('아래 글을 복사하세요',txt));return;}
});
document.addEventListener('keydown',e=>{if(S.view!=='exam'||e.target.closest('input,textarea'))return;const E=S.ex;const q=Q[E.qs[E.cur]];
 const m='abcde'.indexOf(e.key.toLowerCase());if(m>=0&&m<q.o.length){E.ans[E.cur]=m;rerender();}
 else if(e.key==='ArrowRight'&&E.cur<E.qs.length-1){E.cur++;rerender();}else if(e.key==='ArrowLeft'&&E.cur>0){E.cur--;rerender();}});
route();
})();
</script>
</body>
</html>
